<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Harness · Connected Client Experience</title>
<style>:root{--bg:#f3f5f9;--panel:#fff;--ink:#121c2b;--ink2:#46556a;--mut:#7d8a9c;--line:#e2e7ef;--line2:#eef1f6;--acc:#c8501e;--acc2:#fff1e8;--ok:#0f8a5f;--okbg:#e6f6ee;--warn:#a35a00;--warnbg:#fff3df;--dn:#c2410c;--blue:#2563eb;--bluebg:#e8f0ff;--sh:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.06);--r:14px;
  --sans:Inter,ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--serif:Georgia,"Times New Roman",serif;--navy:#0f1d33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d131c;--panel:#151d29;--ink:#e8edf4;--ink2:#b3bfcd;--mut:#8592a3;--line:#253042;--line2:#1b2431;--acc:#ff8a4c;--acc2:#2a1b12;--ok:#3ccf91;--okbg:#0f281e;--warn:#ffb54a;--warnbg:#2b2111;--dn:#ff8a5c;--blue:#7aa7ff;--bluebg:#16233d;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
/* top */
.top{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap}.brand b{font-size:14.5px}
.brand em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--acc);background:var(--acc2);padding:2px 8px;border-radius:99px}
.mark{display:grid;grid-template-columns:repeat(2,7px);gap:3px}.mark i{width:7px;height:7px;border-radius:2px;background:#82b6ff}.mark i:nth-child(2){background:#7fd4ab}.mark i:nth-child(3){background:#f0b870}.mark i:nth-child(4){background:#b9a5f5}
.cmd{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:5px 5px 5px 6px;max-width:860px;margin:0 auto;position:relative}
.cmd:focus-within{border-color:var(--ink2);background:var(--panel)}
.cmd input{flex:1;border:0;outline:0;background:transparent;font:15px var(--sans);color:var(--ink);padding:6px 4px;min-width:0}
.asker{position:relative}
.askbtn{display:flex;align-items:center;gap:6px;border:0;background:var(--panel);border-radius:10px;padding:3px 8px 3px 3px;font-size:13px;font-weight:600;box-shadow:var(--sh)}
.askbtn i{font-style:normal;color:var(--mut);font-size:10px}
.menu{position:absolute;top:42px;left:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:6px;z-index:20;width:240px}
.menu button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:6px;border-radius:8px;text-align:left}.menu button:hover{background:var(--line2)}
.menu span{display:flex;flex-direction:column}.menu small{color:var(--mut);font-size:11.5px}
.send{border:0;background:var(--acc);color:#fff;font-weight:700;border-radius:10px;padding:8px 16px}.send:disabled{opacity:.45}
.topact{display:flex;align-items:center;gap:8px;white-space:nowrap}
.mode{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--line2);color:var(--ink2)}.mode.live{background:var(--okbg);color:var(--ok)}.mode.replay{background:var(--warnbg);color:var(--warn)}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 11px;font-size:12.5px;text-decoration:none;color:var(--ink)}
.primary{border:1px solid var(--ink);background:var(--ink);color:var(--panel);border-radius:10px;padding:8px 14px;font-weight:700}
.sm{padding:4px 9px;font-size:12px}
.avatar{border-radius:50%;flex:none;display:block}
/* stage */
.stage{display:grid;grid-template-columns:360px minmax(0,1fr);min-height:0;position:relative}
body.benched .stage{grid-template-columns:360px minmax(0,1fr) 560px}
.orch{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px}
.oh{display:flex;align-items:center;gap:10px;margin-bottom:12px}.oh b{font-size:15px}.oh small{display:block;color:var(--mut);font-size:12px}
.obadge{width:34px;height:34px;border-radius:10px;background:var(--navy);color:#ffd27a;display:grid;place-items:center;flex:none}
.obadge.pulse{animation:glow 1.2s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,210,122,.35)}}
.olead{color:var(--ink2);font-size:13.5px;margin:0 0 14px}
.olbl{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:0 0 7px}
.sugs{display:flex;flex-direction:column;gap:6px}
.sug{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:9px 12px;font-size:13px;transition:border-color .15s,transform .15s}.sug:hover{border-color:var(--acc);transform:translateX(2px)}
.warnbox{background:var(--warnbg);color:var(--ink);border-radius:11px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.req{display:flex;gap:9px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:10px;font-size:13.5px;margin-bottom:10px}.req small{display:block;color:var(--mut);font-size:11.5px}
.ostat{border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:2px}.ostat small{color:var(--ink2);font-size:12px}
.ostat.think{flex-direction:row;align-items:center;gap:10px;background:var(--acc2)}.ostat.think span:last-child{display:flex;flex-direction:column}
.ostat.ask{background:var(--warnbg)}.ostat.ok{background:var(--okbg);color:var(--ok)}.ostat.plan{background:var(--bluebg)}
.obar{height:5px;background:rgba(37,99,235,.15);border-radius:99px;overflow:hidden;margin-top:5px}.obar i{display:block;height:100%;background:var(--blue);transition:width .5s}
.osec{margin-bottom:14px}
.fact{display:grid;grid-template-columns:72px 1fr;gap:8px;font-size:12.5px;color:var(--ink2);padding:3px 0}.fact span{font-weight:700;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding-top:1px}
.und b{display:block;font-size:13.5px;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-style:normal;font-size:11.5px;background:var(--line2);color:var(--ink2);border-radius:6px;padding:1px 7px}.chip.acc{background:var(--acc2);color:var(--acc);font-weight:700}
.lr{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;padding:3px 0;animation:rise .3s ease both}
.src{flex:none;font:700 9px/1 var(--mono);padding:3px 4px;border-radius:4px;margin-top:2px}.src.ai{background:var(--acc2);color:var(--acc)}.src.rule{background:var(--line2);color:var(--ink2)}
.ans2{border-left:3px solid var(--ok);padding:3px 0 3px 9px;margin-bottom:6px;font-size:12.5px}.ans2 b{display:block}.ans2 small{color:var(--ink2)}
.wv{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);margin:8px 0 4px}.wv span{font-weight:800;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}.wv::after{content:"";flex:1;height:1px;background:var(--line)}
.trow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:7px 9px;margin-bottom:5px;transition:border-color .15s}
.trow:hover,.trow.sel{border-color:var(--ink2)}
.trow>span{flex:1;min-width:0;display:flex;flex-direction:column}.trow small{color:var(--mut);font-size:11px}.trow b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-style:normal;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap;background:var(--line2);color:var(--ink2)}
.pill.ready{background:var(--bluebg);color:var(--blue)}.pill.running{background:var(--acc2);color:var(--acc)}.pill.review{background:var(--warnbg);color:var(--warn)}.pill.approved{background:var(--okbg);color:var(--ok)}.pill.failed{background:#fde8e1;color:var(--dn)}
.auto{margin-left:auto;border:0;background:var(--navy);color:#ffd27a;font:700 11px var(--sans);letter-spacing:0;text-transform:none;border-radius:8px;padding:4px 9px}.auto.on{background:var(--acc);color:#fff}
.hint{font-size:12px;color:var(--mut);margin:8px 0 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stats div{background:var(--bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}.stats b{font-size:20px}.stats small{color:var(--mut);font-size:11.5px}
.qcard{background:var(--warnbg);border-radius:12px;padding:12px;margin-bottom:12px}.qt{font-weight:700;margin-bottom:6px}.qwhy{font-size:12.5px;color:var(--ink2);margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 10px;margin-bottom:5px;font-weight:600}.opt:hover{border-color:var(--acc)}
.other{display:flex;gap:6px;margin:4px 0}.other input{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;background:var(--panel);color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--ink2);text-decoration:underline;font-size:12px;padding:2px 0}
/* team floor */
.floor{overflow-y:auto;padding:16px 20px}
.fh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}.fh b{font-size:17px}.fh small{display:block;color:var(--mut);font-size:12.5px}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--ink2)}.legend span{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.dot.ready{background:var(--blue)}.dot.running{background:var(--acc)}.dot.review{background:#e0a21b}.dot.approved{background:var(--ok)}
.team{margin-bottom:14px}
.teamh{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:7px}.teamh i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px 10px 12px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s,opacity .3s,border-color .2s}
.pcard:hover{transform:translateY(-2px)}
.pcard.idle{opacity:.5;box-shadow:none}.pcard.idle:hover{opacity:.85}
.pcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;border-radius:16px 16px 0 0;background:var(--c);opacity:0;transition:opacity .2s}
.pcard:not(.idle)::before{opacity:1}
.pcard.sel{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent),var(--sh)}
.pcard.landed{animation:land .6s ease}@keyframes land{30%{transform:scale(1.06)}}
.av{position:relative;display:block}
.ring{position:absolute;inset:-5px;border-radius:50%;border:3px solid var(--acc);border-right-color:transparent;animation:spin 1s linear infinite}
.cnt{position:absolute;top:-4px;right:-6px;min-width:20px;height:20px;border-radius:99px;background:var(--navy);color:#ffd27a;font:800 11px/20px var(--sans);padding:0 5px;box-shadow:0 0 0 2px var(--panel)}
.pn{display:flex;flex-direction:column}.pn b{font-size:13.5px}.pn b em{font-style:normal;font-size:10px;font-weight:700;color:var(--acc);background:var(--acc2);border-radius:99px;padding:0 5px;vertical-align:1px}.pn small{color:var(--mut);font-size:11.5px}
.pdo{font-size:11px;color:var(--mut);line-height:1.3}
.pst{font-size:11px;font-weight:800;border-radius:99px;padding:2px 9px}
.pst.ready{background:var(--bluebg);color:var(--blue)}.pst.blocked{background:var(--line2);color:var(--mut)}.pst.running{background:var(--acc2);color:var(--acc)}.pst.review{background:var(--warnbg);color:var(--warn);animation:nudge 1.6s ease-in-out infinite}.pst.approved{background:var(--okbg);color:var(--ok)}.pst.failed{background:#fde8e1;color:var(--dn)}
@keyframes nudge{50%{box-shadow:0 0 0 4px rgba(224,162,27,.25)}}
.pag{display:flex;flex-wrap:wrap;justify-content:center;gap:3px}.pag em{font:600 10px var(--mono);font-style:normal;color:var(--ink2);background:var(--line2);border-radius:5px;padding:1px 5px}
/* workbench */
.bench{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;box-shadow:-12px 0 30px rgba(16,24,40,.06);animation:slide .3s ease}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.bh{padding:14px 16px 0;border-bottom:1px solid var(--line)}
.bperson{display:flex;align-items:center;gap:12px;padding-bottom:12px}.bperson span{flex:1;display:flex;flex-direction:column}.bperson b{font-size:16px}.bperson small{color:var(--mut)}
.x{border:0;background:var(--line2);border-radius:8px;width:30px;height:30px}
.btabs{display:flex;gap:4px}.btabs button{border:0;background:none;padding:7px 10px;font:700 12px var(--mono);color:var(--mut);border-bottom:2px solid transparent}.btabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.bbody{flex:1;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:10px}
.tkhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}.tkid{font:800 13px var(--mono)}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.stepper span{font-size:11px;font-weight:700;color:var(--mut);border-top:4px solid var(--line);padding-top:5px}
.stepper span.done{color:var(--ok);border-top-color:var(--ok)}.stepper span.now{color:var(--acc);border-top-color:var(--acc)}
.card{border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.card h3{margin:0 0 4px;font-size:15.5px}.card p{margin:0 0 4px;font-size:13px;color:var(--ink2)}.why{background:var(--line2);border-radius:8px;padding:6px 9px}
.agentrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:5px}
.agentb{font-weight:800;font-size:13px;background:var(--navy);color:#ffd27a;border-radius:8px;padding:3px 9px}
.route{font:700 11px var(--mono);color:var(--acc);background:var(--acc2);border-radius:6px;padding:2px 6px}.svc{font:500 11px var(--mono);color:var(--mut)}
.dep{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px}.dep span{flex:1;display:flex;flex-direction:column}.dep small{color:var(--mut)}
.ctxsum{font-size:12.5px;color:var(--ink2);margin-bottom:6px}.reuse{color:#7c5cd6}
.lyrs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}.lyrs span{font-size:11px;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;padding:1px 6px;color:var(--ink2)}
.item{display:flex;gap:7px;font-size:12px;color:var(--ink2);padding:3px 5px;border-radius:7px;align-items:baseline}.item b{color:var(--ink)}.item small{color:var(--mut)}.item.re{background:#7c5cd614}.item.wh{font-style:italic;opacity:.75}
.sid{font:700 10.5px var(--mono);color:var(--mut);background:var(--line2);border-radius:4px;padding:0 4px;white-space:nowrap}
.run{border:0;background:linear-gradient(135deg,#ff7a3d,#c8501e);color:#fff;font-weight:800;font-size:15px;border-radius:12px;padding:13px;box-shadow:0 6px 18px rgba(200,80,30,.3);transition:transform .15s}.run:hover{transform:translateY(-1px)}
.waitbox{background:var(--line2);border-radius:11px;padding:10px 12px;font-size:13px;color:var(--ink2)}
.card.live{border-color:var(--acc);background:linear-gradient(var(--panel),var(--panel)) padding-box}
.act{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:3px 0;flex-wrap:wrap;animation:rise .3s ease both}.act.ok{color:var(--ok)}.act.now{color:var(--acc)}
.act code{font:11px var(--mono);background:var(--line2);border-radius:5px;padding:1px 5px;color:var(--ink2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sysb{font-size:11px;font-weight:800;color:#fff;background:var(--c);border-radius:6px;padding:1px 7px;white-space:nowrap}.via{font:700 9.5px var(--mono);color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 3px}.res{color:var(--ok);font-size:12px}
.demo{font:800 9.5px var(--mono);font-style:normal;color:var(--warn);background:var(--warnbg);border-radius:4px;padding:0 4px}
.says{font:italic 14px/1.5 var(--serif);color:var(--ink2)!important}
.doc{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px}
.dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--line2);padding:8px 11px}.dh small{color:var(--mut);margin-left:auto;font-size:11.5px}
.kind{font:800 10px var(--mono);color:#fff;background:#e5533c;border-radius:5px;padding:2px 6px}
.db{padding:6px 14px 10px;font:14px/1.55 var(--serif)}.db p{margin:5px 0;color:var(--ink)!important;font-size:14px!important}.db ul{margin:3px 0;padding-left:20px}.db h5{font:800 11px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--acc);margin:10px 0 2px}
.vds{display:flex;flex-wrap:wrap;gap:5px}.vd{font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:2px 7px}.vd em{font-style:normal;color:var(--mut)}
.vd.published,.vd.committed{border-color:var(--ok);color:var(--ok)}.vd.approval,.vd.proposed,.vd.pending{border-color:var(--warn);color:var(--warn)}.vd.blocked,.vd.rejected,.vd.flagged{border-color:var(--dn);color:var(--dn)}
.approvebar{position:sticky;bottom:-20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--warnbg);border:1px solid #f2c776;border-radius:12px;padding:10px 12px;font-size:12.5px;box-shadow:var(--sh)}.approvebar span{flex:1;min-width:180px}
.empty{padding:10px 2px}.muted{color:var(--mut);font-size:12.5px}
/* foundation */
.found{display:flex;align-items:center;gap:18px;padding:10px 18px;background:var(--navy);color:#dfe7f3;overflow-x:auto}
.fl{display:flex;flex-direction:column;min-width:170px}.fl b{color:#ffd27a;font-size:13px}.fl small{color:#9fb0c7;font-size:11.5px;white-space:nowrap}
.layers{display:flex;gap:6px}
.ly{display:flex;flex-direction:column;align-items:center;min-width:78px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:all .3s}
.ly b{font-size:17px;color:#fff}.ly span{font-size:10.5px;color:#9fb0c7;white-space:nowrap}
.ly.read{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,transparent)}.ly.write{border-color:var(--c);background:color-mix(in srgb,var(--c) 45%,transparent);transform:translateY(-3px)}
.syss{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto}
.sy{font-size:11px;border-radius:99px;padding:2px 9px;background:rgba(255,255,255,.06);color:#9fb0c7;display:flex;gap:5px;align-items:center;transition:all .25s}.sy b{color:#fff}
.sy.used{background:color-mix(in srgb,var(--c) 30%,transparent);color:#fff}.sy.hot{background:var(--c);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 40%,transparent)}
/* flying tickets */
.fly{position:fixed;inset:0;pointer-events:none;z-index:50}
.tk{position:fixed;transform:translate(0,0);margin:-14px 0 0 -40px;width:80px;height:28px;border-radius:7px;background:var(--panel);border:2px solid var(--c);border-left-width:6px;font:800 10.5px/24px var(--mono);text-align:center;color:var(--ink);box-shadow:0 8px 20px rgba(16,24,40,.25);transition:transform .85s cubic-bezier(.5,0,.2,1),opacity .85s ease-in}
.tk.handoff{background:var(--c);color:#fff}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;z-index:60}.toast.on{opacity:1;transform:translateX(-50%)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(5px)}}
@media (max-width:1280px){body.benched .stage{grid-template-columns:320px minmax(0,1fr) 480px}.stage{grid-template-columns:320px minmax(0,1fr)}}

/* Parse a catalogue route into stages. Items in one stage run together; stages run in order.
   The last stage is the output. Brackets may contain "+" or "/", so split only outside them. */
function parseRoute(route) {
  const splitTop = (s, sep) => { const out = []; let depth = 0, cur = ''; for (let i = 0; i < s.length; i++) { const c = s[i]; if (c === '[') depth++; if (c === ']') depth--; if (depth === 0 && s.startsWith(sep, i)) { out.push(cur); cur = ''; i += sep.length - 1; continue; } cur += c; } out.push(cur); return out.map(x => x.trim()).filter(Boolean); };
  const stages = splitTop(String(route).replace(/\.\s*$/, ''), '→');
  const output = stages.length > 1 ? stages.pop() : '';
  return { output, stages: stages.map(st => splitTop(st, ' + ').flatMap(item => {
    if (/^\[.*\]$/.test(item)) return [{ kind: 'service', raw: item, keys: serviceKeys(item) }];
    const m = item.match(/^(\w+)\.(.+)$/);
    if (m && SUBAGENTS[m[1]]) return m[2].split('/').map(s => { const r = routeInfo(m[1] + '.' + s.trim()); return r ? Object.assign({ kind: 'agent', grp: item }, r) : { kind: 'check', raw: m[1] + '.' + s.trim() }; });
    return [{ kind: 'check', raw: item }];
  })).flatMap(st => st.length > 1 && st.every(i => i.grp && i.grp === st[0].grp) ? st.map(i => [i]) : [st]) }; /* "Schedule.Compliance/Calendar" alone in a stage runs in order */
}

/* The catalogue entries closest to a request (word overlap, intent words weigh more). Shown to the planner as reference patterns. */
function cataloguePatterns(text, k = 3) {
  const stop = new Set(['what', 'this', 'that', 'with', 'their', 'they', 'have', 'from', 'about', 'should', 'which', 'when', 'them', 'me', 'my', 'the', 'and', 'for', 'are', 'you', 'your', 'show', 'give', 'next', 'month', 'week', 'tomorrow', 'today', 'last', 'year']);
  /* fund nicknames and tickers count as "fund", so "Compare BFA and AMBAL" matches fund comparisons */
  const funds = /\b(gfa|bfa|ambal|wmif|ifa|gfffx|agthx|vwuax|vigax|abnfx|abndx|ambfx|awshx|abalx|amecx|cggr|cgdv|cgcp|cgui|cgxu)\b/g;
  const toks = s => new Set(String(s).toLowerCase().replace(funds, 'fund').replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !stop.has(w)).map(w => w.replace(/(ing|ed|es|s)$/, '')));
  const q = toks(text);
  return CATALOGUE.map(c => { const t = toks(c.ask + ' ' + c.decomp); let s = 0; q.forEach(w => { if (t.has(w)) s += 1; }); return { c, s: s / Math.sqrt(t.size + 1) }; })
    .filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, k).map(x => x.c);
}
const catalogueExact = text => CATALOGUE.find(c => c.ask.replace(/[.?]$/, '').toLowerCase() === String(text).trim().replace(/[.?]$/, '').toLowerCase());

    const messages = [{ role: 'system', content: 'You are a specialist inside an enterprise workbench. When you are done, reply with a single JSON object only.' }, { role: 'user', content: prompt }];

}
function clarifyHTML(r) {

const icoOrch = () => '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/><path d="M12 7.2v4.3M12 11.5l-5.6 5.6M12 11.5l5.6 5.6"/></svg>';

/* middle: the team floor */
function paintFloor() {

      TEAM_ORDER.map(tm => `<div class="team" style="--c:${TCOL(tm)}"><div class="teamh"><i></i>${h(TEAMS[tm].name)}</div><div class="cards">${ROSTER.filter(p => p.team === tm).map(p => `<button type="button" class="pcard idle" data-person="${h(p.name)}" style="--c:${TCOL(tm)}"></button>`).join('')}</div></div>`).join('');

      <span class="pn"><b>${h(p.name)}${p.name === meName() ? ' <em>you</em>' : ''}</b><small>${h(p.role)}</small></span>

/* right: the workbench for one person */
function paintBench() {

  if (!b._init) { b.innerHTML = `<div class="bh"></div><div class="bbody"></div>`; b._init = 1; }
  setHTML(b.querySelector('.bh'), `<div class="bperson" style="--c:${TCOL(p.team)}">${avatar(p.name, TCOL(p.team), 52)}<span><b>${h(p.name)}</b><small>${h(p.role)} · ${h(TEAMS[p.team].short || TEAMS[p.team].name)} workbench</small></span><button type="button" class="x" data-close aria-label="Close">✕</button></div>
    ${ts.length > 1 ? `<div class="btabs">${ts.map(x => `<button type="button" class="${x === t ? 'on' : ''}" data-tab-task="${x.id}">${tid(r, x)}</button>`).join('')}</div>` : ''}`);
  const key = p.name + '|' + (t ? t.id : '') + '|' + (r ? r.id : ''); if (b._key !== key) { b._key = key; b.querySelector('.bbody').scrollTop = 0; }
  setHTML(b.querySelector('.bbody'), t ? ticketHTML(r, t, p) : `<div class="empty"><p><b>No tickets for ${h(p.name.split(' ')[0])}</b> in this request.</p><p class="muted">${h(p.does)}</p><div class="olbl">Agents on this workbench</div><div class="chips">${Object.keys(AGENTS).filter(a => roleOf(a) === p.rid).map(a => `<em class="chip">${h(AGENTS[a].name)}</em>`).join('')}</div></div>`);
}
const gist = out => { if (out == null) return ''; if (typeof out !== 'object') return String(out).slice(0, 60); if (Array.isArray(out)) return `${out.length} record${out.length === 1 ? '' : 's'}`; const a = Object.entries(out).find(([, x]) => Array.isArray(x) && x.length); return a ? `${a[1].length} ${a[0].replace(/_/g, ' ')}` : `${Object.keys(out).length} fields`; };
const argText = i => Object.entries(i || {}).filter(([, x]) => x !== '' && x != null).map(([k, x]) => `${k}: ${Array.isArray(x) ? x.join(', ') : String(x)}`.slice(0, 36)).join(', ');
const reusedIn = (t, i) => { const rec = F.memory.find(m => m.id === i.id) || F.findings.find(k => k.id === i.id); return !!(rec && (rec.origin || rec.by) && (rec.origin || rec.by) !== t.agent); };
function bodyHTML(s) {
  const ids = x => h(x).replace(/\b([A-Z]{2,5}-[A-Z0-9]{1,6}(?:-[A-Z0-9]+)?)\b/g, '<span class="sid">$1</span>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  let html = '', list = false;
  for (const ln of String(s || '').split('\n')) { const m = ln.match(/^\s*[-•*]\s+(.*)/); if (m) { if (!list) { html += '<ul>'; list = true; } html += `<li>${ids(m[1])}</li>`; } else { if (list) { html += '</ul>'; list = false; } if (ln.trim()) html += (/^#{1,4}\s/.test(ln.trim()) || /:$/.test(ln.trim())) && ln.length < 70 ? `<h5>${ids(ln.replace(/^#+\s*/, ''))}</h5>` : `<p>${ids(ln)}</p>`; } }
  return html + (list ? '</ul>' : '');
}
const VERB = { published: 'Published to shared knowledge', committed: 'Committed to shared memory', pending: 'Proposed for memory', rejected: 'Not stored', blocked: 'Blocked', read: 'Read only', task: 'Kept to this task', proposed: 'Proposed, needs you', flagged: 'Flagged for a number check', approval: 'Needs your approval' };
function ticketHTML(r, t, p) {
  const s = status(r, t), R = roleOfT(t), deps = depsOf(r, t), A = AGENTS[t.agent];
  const P = t.packet || (r.tasks.length ? (() => { try { return buildPacket(t, r); } catch (e) { return null; } })() : null);
  const byL = {}; (P ? P.items : []).forEach(i => (byL[i.layer] = byL[i.layer] || []).push(i));
  const reused = P ? P.items.filter(i => reusedIn(t, i)) : [];
  const steps = ['Assigned', 'Agents working', 'Review', 'Approved'], at = { ready: 0, blocked: 0, running: 1, failed: 1, review: 2, approved: 3 }[s];
  const out = t.result && t.result.output;
  const waitOut = (t.verdicts || []).map(v => v.kind === 'output' && F.outputs.find(o => o.id === v.id)).find(o => o && o.status === 'Waiting for approval');
  return `<div class="tkhead"><span class="tkid">${tid(r, t)}</span><em class="pill ${s}">${h(ST_LABEL[s])}</em><span class="muted">from Orchestrator for ${h(EMPLOYEES[r.requester].name)} · wave ${t.wave}</span></div>
    <div class="stepper">${steps.map((x, k) => `<span class="${k < at || s === 'approved' ? 'done' : k === at ? 'now' : ''}">${h(x)}</span>`).join('')}</div>
    <div class="card"><div class="olbl">Request</div><h3>${h(t.title)}</h3><p>${h(t.objective)}</p>${t.why ? `<p class="why"><b>Why ${h(R.name)}:</b> ${h(t.why)}</p>` : ''}</div>
    <div class="card"><div class="olbl">Agents on this ticket</div><div class="agentrow"><span class="agentb">${h(A.name)}</span>${t.route ? `<span class="route">${h(t.route)}</span>` : ''}${(t.services || []).map(x => `<span class="svc">[${h(x)}]</span>`).join('')}</div><p class="muted">${h(A.does)}</p></div>
    ${deps.length ? `<div class="card"><div class="olbl">Builds on</div>${deps.map(d => `<div class="dep ${status(r, d)}">${avatar(personOf(d), TCOL(roleOfT(d).team), 24)}<span><b>${tid(r, d)} · ${h(personOf(d))}</b><small>${h(d.result && d.result.output ? d.result.output.title : d.title)}</small></span><em class="pill ${status(r, d)}">${h(ST_LABEL[status(r, d)])}</em></div>`).join('')}</div>` : ''}
    ${P ? `<div class="card"><div class="olbl">Context from the shared foundation <span class="muted">${t.packet ? 'attached' : 'will be attached'}</span></div>
      <div class="ctxsum"><b>${P.items.length}</b> items from <b>${Object.keys(byL).length}</b> layers${reused.length ? ` · <b class="reuse">${reused.length} reused from other teams</b>` : ''}${P.withheld.length ? ` · ${P.withheld.length} withheld by policy` : ''}</div>
      <div class="lyrs">${Object.entries(byL).map(([l, xs]) => `<span style="--c:${LAYER_COL[l] || '#888'}">${h((LAYERS[l] || {}).short || l)} <b>${xs.length}</b></span>`).join('')}</div>
      ${P.items.filter(i => i.layer !== 'policy').sort((x, y) => reusedIn(t, y) - reusedIn(t, x)).slice(0, 4).map(i => `<div class="item${reusedIn(t, i) ? ' re' : ''}"><span class="sid">${h(i.id)}</span><span><b>${h(i.label)}</b> ${h(String(i.value).slice(0, 110))}${String(i.value).length > 110 ? '…' : ''}<small> · ${h(i.from || '')}${reusedIn(t, i) ? ' · reused' : ''}</small></span></div>`).join('')}
      ${P.withheld.slice(0, 2).map(w => `<div class="item wh"><span class="sid">${h(w.id)}</span><span>Withheld · ${h(w.why)}</span></div>`).join('')}</div>` : ''}
    ${s === 'ready' ? `<button type="button" class="run" data-run="${t.id}">▶ Run agents</button>` : s === 'blocked' ? `<div class="waitbox">Waiting for ${deps.filter(d => !ST.approved.has(d.id)).map(d => `${tid(r, d)} (${h(personOf(d))})`).join(', ')} to be approved.</div>` : ''}
    ${t.state === 'running' || t.calls ? `<div class="card live"><div class="olbl">${t.state === 'running' ? '<span class="spin"></span> Agents working' : 'What the agents did'}</div>
      <div class="act ${t.packet ? 'ok' : 'now'}">${t.packet ? '✓' : '…'} Context assembled from the foundation</div>
      ${(t.calls || []).map(c => `<div class="act call${c.error ? ' err' : ''}"><span class="sysb" style="--c:${SYS_COL[c.sys] || '#888'}">${h((SYSTEMS[c.sys] || {}).name || c.sys || 'gateway')}</span><span class="via">${h(c.via || '')}</span><code>${h(c.name)}(${h(argText(c.input))})</code><span class="res">${c.error ? h(c.error) : h(gist(c.out)) + (c.out && c.out.synthesized ? ' <em class="demo">DEMO</em>' : '')}</span></div>`).join('')}
      ${t.state === 'running' ? `<div class="act now"><span class="spin"></span> ${t.packet ? (t.calls || []).length ? 'Drafting from the context and results' : 'Calling systems only for what the foundation doesn’t hold' : 'Reading the foundation'}</div>` : `<div class="act ok">✓ ${t.calls && t.calls.length ? `${t.calls.length} system call${t.calls.length > 1 ? 's' : ''}; everything else came from the foundation` : 'No system calls needed; the foundation had it'}</div>`}</div>` : ''}
    ${t.result ? `<div class="card"><div class="olbl">Result</div>${t.result.says ? `<p class="says">“${h(t.result.says)}”</p>` : ''}${out && out.body ? `<div class="doc"><div class="dh"><span class="kind">${h(String(out.kind || 'output').toUpperCase())}</span><b>${h(out.title || '')}</b>${t.contract && t.contract.as_of.length ? `<small>As of ${h(t.contract.as_of.join(', '))}</small>` : ''}</div><div class="db">${bodyHTML(out.body)}</div></div>` : ''}</div>` : ''}
    ${t.verdicts ? `<div class="card"><div class="olbl">Gatekeeper</div><div class="vds">${t.verdicts.map(v => { const o = v.kind === 'output' && F.outputs.find(y => y.id === v.id), vs = o && o.status === 'Waiting for approval' ? 'approval' : v.status; return `<span class="vd ${vs}" title="${h(v.reason || '')}">${h(v.kind)}: ${h(VERB[vs] || vs)}${v.id ? ` <span class="sid">${h(v.id)}</span>` : ''}${['rejected', 'blocked', 'flagged'].includes(vs) && v.reason ? ` <em>${h(v.reason)}</em>` : ''}</span>`; }).join('')}</div></div>` : ''}
    ${s === 'review' ? `<div class="approvebar"><span>${waitOut ? `<b>Client-facing.</b> Nothing goes out until you approve “${h(waitOut.title)}”.` : `<b>Review ${h(p.name.split(' ')[0])}’s work.</b> Approving hands it to the next team.`}</span><button type="button" class="ghost" data-back="${t.id}">Request changes</button><button type="button" class="primary" data-approve="${t.id}">✓ Approve and hand off</button></div>` : ''}
    ${s === 'failed' ? `<div class="warnbox">${h(t.error || 'Failed')}</div>` : ''}`;

/* bottom: the shared foundation */
HX.op = o => { ST.ops.push(Object.assign({ at: performance.now() }, o)); if (o.kind === 'call' && o.sys) ST.flash['s:' + o.sys] = performance.now(); HX.schedule(); setTimeout(HX.schedule, 1500); };
HX.flash = (l, cls) => { ST.flash['l:' + l] = { at: performance.now(), cls }; HX.schedule(); setTimeout(HX.schedule, 1500); };
function paintFound() {
  const now = performance.now(), r = run(), hot = k => { const f = ST.flash[k]; if (!f) return ''; const at = typeof f === 'number' ? f : f.at; return now - at < 1400 ? (f.cls || 'hot') : ''; };

    <div class="layers">${LAYER_ORDER.map(l => `<div class="ly ${hot('l:' + l)}" style="--c:${LAYER_COL[l]}"><b>${layerCount(l)}</b><span>${h(LAYERS[l].short || LAYERS[l].name)}</span></div>`).join('')}</div>
    <div class="syss">${SYS_ORDER.map(k => { const n = r ? r.tasks.reduce((m, t) => m + (t.calls || []).filter(c => c.sys === k).length, 0) : 0; return `<span class="sy ${hot('s:' + k) ? 'hot' : n ? 'used' : ''}" style="--c:${SYS_COL[k]}" title="${h(SYSTEMS[k].name)}">${h(SYSTEMS[k].name.split(/[ &]/)[0])}${n ? `<b>${n}</b>` : ''}</span>`; }).join('')}</div>`);
}

let tt; HX.toast = m => { const t = el('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 3400); };
HX.ai = () => paintTop();

  if ((x = q('.pcard'))) { ST.open = x.dataset.person; const t = run() && run().tasks.find(y => personOf(y) === ST.open); ST.openTask = t ? t.id : null; paintAll(); return; }
  if ((x = q('[data-tab-task]'))) { ST.openTask = x.dataset.tabTask; paintAll(); return; }
  if (q('[data-close]')) { ST.open = null; ST.openTask = null; paintAll(); return; }
  if ((x = q('[data-run]'))) { startTask(run().tasks.find(y => y.id === x.dataset.run)); return; }

});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ST.open) { ST.open = null; paintAll(); } if (e.target.classList && e.target.classList.contains('clarIn') && e.key === 'Enter') answer(e.target.value.trim()); });
el('composer').onsubmit = e => { e.preventDefault(); const v = el('ask').value; el('ask').value = ''; ask(v); };
