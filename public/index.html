<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connected Client Experience · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --night:var(--night);--night-2:var(--night-2);--night-3:var(--night-3);--line:var(--line);--nt:var(--nt);--nm:var(--nm);
  --paper:#eef2f5;--card:#fff;--ink:#15304a;--mute:#66798c;--rule:#d9e1e8;--soft:#f5f7f9;
  --sales:#82b6ff;--product:#7fd4ab;--marketing:#f0b870;--service:#b9a5f5;--gold:#ffd27a;--alert:#ff7b67;--ok:#2f9e6c;
  --ui:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;--serif:'Newsreader',Georgia,serif;--code:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
:root{--hl:#fff8e6;--hl-b:#e7b54e;--hl-fg:#8a5a00;--hl-strong:#ffe7a6;--bad-bg:#fff2ef;--bad-fg:#a8321e;--bad-b:#e08a7c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0b1826;--card:#122335;--ink:#e8f0f7;--mute:#a3b6c8;--rule:#2a4360;--soft:#172a3f;--hl:#35291a;--hl-b:#a47d2c;--hl-fg:#ffd27a;--hl-strong:#5c4614;--bad-bg:#3a201d;--bad-fg:#ffb8aa;--bad-b:#a0503f}}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.14em}
.app{height:100%;display:flex;flex-direction:column}

/* top */
.top{display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--night);color:var(--nt);border-bottom:1px solid var(--s0);min-height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;white-space:nowrap}
.brand svg{width:26px;height:26px}
.stats{display:flex;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.stat{padding:0 12px;border-left:1px solid var(--line);min-width:84px}
.stat:first-child{border:0}
.stat b{display:block;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--nm);white-space:nowrap}
.stat.gold b{color:var(--acc-t)}
.stat.bump b{animation:bump .6s}
@keyframes bump{30%{transform:translateY(-2px);color:#fff}}
.top-actions{display:flex;gap:4px}
.tbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:8px;padding:7px 10px;color:var(--nt);font-size:13px;white-space:nowrap}
.tbtn:hover{background:var(--night-2)}
.tbtn[aria-pressed="true"]{color:var(--acc-t);border-color:var(--line)}

.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 440px}
.stage{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--stage-bg);color:var(--nt)}
.diagram{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;gap:7px;padding:8px 16px 4px;overflow:auto}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
.row{position:relative;z-index:1}
.rlabel{font-size:11.5px;color:var(--nm);font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:6px;margin-bottom:5px}
.rlabel b{color:var(--nt);font-weight:700}

/* journey */
.journey{display:flex;gap:14px;align-items:stretch}
.acard{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:6px 12px;text-align:left;color:var(--nt);min-width:0;flex:0 1 205px}
.acard:hover{background:rgba(255,255,255,.09)}
.acard .av{width:40px;height:40px;border-radius:50%;background:#e6edf4;color:#16304a;font-weight:800;display:grid;place-items:center;flex:none}
.acard>span{min-width:0}
.acard b{display:block;font-size:14.5px}
.acard small{display:block;font-size:12px;color:var(--nm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chaps{flex:1;display:flex;gap:4px;align-items:stretch;min-width:0}
.chap{flex:1;min-width:0;border-radius:10px;border:1px solid var(--line);padding:4px 5px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.03);text-align:left;color:var(--nm);font-size:12px}
.chap b{display:block;color:var(--nt);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap.done{border-color:var(--sl2);background:rgba(127,166,204,.1)}
.chap.cur{border-color:var(--acc-t);background:rgba(255,210,122,.12);color:var(--acc-t)}
.chap span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* orchestration */
.orch{border:1px solid var(--sl2);border-radius:14px;padding:6px 12px;background:linear-gradient(90deg,rgba(130,182,255,.1),rgba(185,165,245,.1));cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.orch.active{border-color:var(--acc-t);box-shadow:0 0 0 2px rgba(255,210,122,.3)}
.orch .oname{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.orch .oname .ic{color:var(--acc-t);font-size:18px}
.orch .ostages{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--nm)}
.orch .ostages span{padding:1px 8px;border-radius:99px;border:1px solid var(--line)}
.orch .ostages span.on{border-color:var(--acc-t);color:var(--acc-t)}
.tasks{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap}
.task{font-size:11.5px;padding:2px 9px 2px 7px;border-radius:99px;border:1px dashed var(--line);color:var(--nm);display:inline-flex;align-items:center;gap:5px}
.task i{width:7px;height:7px;border-radius:50%;background:currentColor}
.task.active{border-style:solid;border-color:var(--gold);color:var(--gold)}
.task.done{border-style:solid;color:var(--nt);border-color:var(--sl2)}
.task.done i{background:var(--ok)}

/* lanes */
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:12px}
.lane{border-radius:14px;padding:6px 8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:5px}
.lane h3{margin:0 0 2px;font-size:13px;display:flex;align-items:center;gap:7px}
.lane h3 i{width:9px;height:9px;border-radius:50%}
.agent{display:flex;align-items:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--night-2);padding:4px 8px;text-align:left;color:var(--nt);font-size:13px;transition:transform .25s,border-color .25s,background .25s}
.agent .dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--night);font-size:13px;flex:none;opacity:.55}
.agent span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.agent em{font-style:normal;font-size:10.5px;color:var(--nm)}
.agent.done .dot{opacity:1}
.agent.done em{color:var(--ok)}
.agent.active{border-color:var(--acc-t);background:var(--s3);transform:scale(1.03);box-shadow:0 0 0 3px rgba(255,210,122,.25)}
.agent.active .dot{opacity:1}
.agent.next{border-style:dashed;border-color:var(--acc-t)}
.agent.cut{border-color:var(--alert);background:#3a2229}
.agent.hit{border-color:#ffb27a;border-style:dashed}
.more{font-size:11px;color:var(--nm);padding:2px 4px}

/* foundation */
.found{border-radius:18px;padding:10px 12px 8px;margin-bottom:8px;background:linear-gradient(180deg,rgba(255,210,122,.14),rgba(255,210,122,.05));border:1.5px solid rgba(255,210,122,.55);box-shadow:0 0 40px rgba(255,210,122,.08)}

.fhead{display:flex;align-items:center;gap:12px;margin-top:6px}
.fhead b{display:block;color:var(--acc-t);font:500 19px/1.1 var(--serif)}
.fhead span{font-size:12px;color:var(--nt);opacity:.85;margin-left:10px}
@media (max-width:1500px){.fhead>div:first-child>span{display:none}}
.fhead>div:first-child{display:flex;align-items:baseline;flex-wrap:wrap}
.ftot{margin-left:auto;display:flex;gap:14px;white-space:nowrap}
.ftot span{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;color:var(--nm);opacity:1}
.ftot b{font:700 16px var(--ui);color:var(--sw);font-variant-numeric:tabular-nums}
.ftot span{flex-direction:row!important;align-items:baseline!important;gap:4px}
.found.busy{box-shadow:0 0 0 1px rgba(255,210,122,.4),0 0 50px rgba(255,210,122,.18)}
.viz{display:block;min-height:40px;margin:4px 0 2px}
.vz-cap{display:block;font-size:10.5px;color:var(--st2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vz-grid{display:flex;flex-wrap:wrap;gap:3px}
.vz-grid i{width:10px;height:10px;border-radius:2px;background:var(--sl2)}
.vz-grid i.lr{background:var(--gold)}
.vz-row{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;min-height:26px}
.vz-row i{background:var(--c)}
.vz-row.doc i{width:11px;height:14px;border-radius:2px 5px 2px 2px}
.vz-row.chk i{width:14px;height:14px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%}
.vz-row.bar i{width:8px;min-height:8px;border-radius:2px}
.vz-row.bar i{height:calc(var(--h) * .26px)}
.vz-row.dot i{width:12px;height:12px;border-radius:50%}
.vz-line{display:flex;gap:6px;align-items:center;min-height:26px;position:relative;padding:0 2px}
.vz-line::before{content:'';position:absolute;left:0;right:0;top:50%;height:2px;background:var(--sl2)}
.vz-line i{position:relative;width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--s2)}
.vz-line em,.vz-row em{font-size:10.5px;color:var(--nm);font-style:normal;position:relative;background:var(--s2);padding-right:4px}
.vz-graph{display:block;width:100%;height:50px}
.viz i.nw{animation:nw 1s ease-in-out infinite;box-shadow:0 0 0 2px #fff}
@keyframes nw{50%{transform:scale(1.35)}}
.th .tn{margin-left:auto}
.tile .th .tn b{display:inline-block;min-width:22px;text-align:center;background:var(--gold);color:#1a2a3a;border-radius:99px;font-size:11.5px;padding:1px 6px}
.tt{display:flex;gap:3px;white-space:nowrap;align-items:center;margin-top:auto;padding-top:5px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;color:var(--st2)}
.tt i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--c);opacity:.45}
.tt i.on{background:var(--c);opacity:1}
.tt span{margin-left:3px}
.agent.entry{flex:0 0 168px;border-color:rgba(255,210,122,.55);background:rgba(255,210,122,.08);border-radius:14px}
.agent.entry .dot{opacity:1;width:34px;height:34px;border-radius:50%;font-size:17px}
.agent.entry b{display:block;font-size:14px}
.agent.entry small{display:block;font-size:11.5px;color:var(--acc-t)}
.agent.entry em{display:none}
.agent.entry.active{background:rgba(255,210,122,.2)}
.entrycard{border:1px solid var(--hl-b);background:var(--hl);border-radius:14px;padding:10px 12px}

.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.tile{position:relative;border-radius:12px;border:1px solid var(--sl2);background:var(--s2);padding:8px 9px;text-align:left;color:var(--nt);min-height:112px;display:flex;flex-direction:column;gap:3px;transition:border-color .3s,background .3s,box-shadow .3s}
.tile:hover{border-color:var(--sw)}
.tile .th{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.tile .th .ic{color:var(--acc-t)}
.tile .tn{font-size:11px;color:var(--st2)}
.tile .tn b{color:var(--acc-t);font-size:13px}
.tile .tl{font-size:12px;color:var(--nt);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tl.fresh{color:var(--sw)}
.tile.read{border-color:var(--product);box-shadow:0 0 0 2px rgba(127,212,171,.35)}
.tile.write{border-color:var(--acc-t);background:#2a4466;box-shadow:0 0 0 3px rgba(255,210,122,.4)}
.tile.off{border-color:var(--alert);background:#2a1a1e;border-style:dashed}
.tile .arch{margin-top:auto;font-size:10.5px;color:var(--nm);align-self:flex-start}
.tile:hover .arch{color:var(--acc-t)}

/* integration */
.integ{border-radius:14px;padding:6px 10px;border:1px solid var(--line);background:rgba(0,0,0,.18)}
.systems{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sys{border-radius:10px;border:1px solid var(--line);background:var(--s1);padding:5px 9px;text-align:left;color:var(--nt);display:flex;gap:8px;align-items:center;transition:border-color .3s,box-shadow .3s}
.sys .ic{font-size:18px;color:var(--nm)}
.sys b{display:block;font-size:12.5px}
.sys small{display:block;font-size:10.5px;color:var(--nm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sys.hot{border-color:var(--sw);box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.sys .via{margin-left:auto;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;display:none}
.sys.hot .via{display:inline-block}
.via.MCP{background:#82b6ff;color:var(--night)}
.via.API{background:#7fd4ab;color:var(--night)}
.gw{display:flex;gap:8px;margin-top:6px;font-size:11.5px;color:var(--nm);align-items:center;flex-wrap:wrap}
.gw span{border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.gw b{color:var(--nt)}
.gw .legend{margin-left:auto;display:flex;gap:8px;align-items:center}

/* wires */
.wire.dispatch{stroke:#c9b8ff;stroke-dasharray:4 5}
.wire.read{stroke:var(--product)}
.wire.write{stroke:var(--gold)}
.wire.call{stroke:#fff;stroke-dasharray:3 5;opacity:.7}
.pt{filter:drop-shadow(0 0 5px currentColor)}

/* controls */
.controls{display:flex;align-items:center;gap:8px;padding:2px 16px;flex-wrap:wrap}
.grow{flex:1}
.cbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--nt);display:grid;place-items:center;font-size:16px}
.cbtn:hover{background:var(--night-2)}
.cbtn:disabled{opacity:.35}
.cbtn.play{width:46px;height:46px;background:var(--gold);border-color:var(--acc-t);color:#1a2a3a;font-size:19px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 10px;font-size:12.5px;color:var(--nm)}
.seg button[aria-pressed="true"]{background:var(--night-3);color:var(--sw)}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--nm);background:none;border:0}
.toggle .sw{width:28px;height:16px;border-radius:99px;background:var(--line);position:relative}
.toggle .sw::after{content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--sw);transition:transform .2s}
.toggle[aria-pressed="true"] .sw{background:var(--gold)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(12px)}
.pbtn{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:8px 15px;font-weight:600;font-size:13.5px;border:1px solid var(--line);background:var(--night-2);color:var(--sw)}
.pbtn:hover{background:var(--night-3)}
.pbtn.gold{background:var(--gold);border-color:var(--acc-t);color:#1a2a3a}
.pbtn.unplug{background:none;border-color:rgba(255,210,122,.6);color:var(--acc-t)}
.scrub{padding:4px 16px 12px;display:flex;gap:3px}
.tick{flex:1;height:18px;border:0;border-radius:4px;background:var(--c);opacity:.22;position:relative;padding:0}
.tick.done{opacity:.9}
.tick.cur{opacity:1;box-shadow:0 0 0 2px var(--sw)}
.tick .mk{position:absolute;left:50%;top:-14px;transform:translateX(-50%);color:var(--acc-t);font-size:11px}

/* rail */
.rail{min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--rule);background:var(--paper)}
.tabs{display:flex;padding:6px 8px 0;border-bottom:1px solid var(--rule);gap:2px}
.tab{position:relative;background:none;border:0;border-bottom:2px solid transparent;padding:9px 10px;font-weight:600;font-size:13.5px;color:var(--mute);margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .badge{position:absolute;top:6px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--alert);display:none}
.tab.has .badge{display:block}
.panes{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0;overflow:auto;padding:14px 16px 40px}
.pane[hidden]{display:none}
.h{font-size:12px;font-weight:700;color:var(--mute);margin:16px 0 6px;display:flex;align-items:center;gap:6px}
.hint{font-size:12.5px;color:var(--mute)}

/* now */
.nw-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.nw-actor{display:flex;align-items:center;gap:10px;margin:8px 0 2px}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--night);font-size:17px;flex:none}
.av.sm{width:22px;height:22px;border-radius:6px;font-size:12px}
.nw-actor b{display:block;font-size:17px}
.nw-actor small{display:block;color:var(--mute);font-size:12.5px}
.nw-title{font-weight:600;margin:6px 0 0}
.quote{font:400 18px/1.5 var(--serif);margin:8px 0}
.quote .caret{display:inline-block;width:2px;height:1em;background:var(--ink);vertical-align:-.15em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.note{font-size:12.5px;color:var(--hl-fg);background:var(--hl);border-radius:8px;padding:5px 9px;display:inline-block}
.calls{display:flex;flex-direction:column;gap:5px}
.call{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:center;font-size:12px;border:1px solid var(--rule);background:var(--card);border-radius:9px;padding:6px 8px}
.call code{font:12px/1.35 var(--code);color:var(--ink);word-break:break-word}
.call .sysn{font-weight:700;white-space:nowrap}
.call.pending{opacity:.6}
.vbadge{font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px}
.vbadge.MCP{background:#dce9ff;color:#1d4e8f}
.vbadge.API{background:#d6f3e5;color:#1f6b48}
.vbadge.Sync,.vbadge.Event,.vbadge.Internal{background:#eee6ff;color:#5b3fa8}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--card);border-radius:99px;padding:3px 10px 3px 8px;font-size:12.5px;color:var(--ink);max-width:100%;text-align:left}
.chip:hover{border-color:var(--mute)}
.chip small{color:var(--mute)}
.chip.reused{border-color:var(--hl-b);background:var(--hl)}
.chip.pending{opacity:.62;border-style:dashed}
.chip.pub{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip.pub small{color:#b8c8d8}
.diff{border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:7px 10px;margin-bottom:5px;font-size:13px}
.diff b{display:block;font-size:12px;color:var(--mute);font-weight:600}
.diff .was{color:var(--mute);text-decoration:line-through;font-size:12px;display:block}
.diff .now{color:var(--ink)}
.diff .newtag{font-size:10.5px;font-weight:700;color:#1f7a51;background:#e3f5ec;border-radius:4px;padding:0 5px;margin-left:6px}
.gdiff{font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.gdiff span{display:flex;gap:6px;align-items:center}
.gdiff i{font-style:normal;color:var(--ok);font-weight:800}
.gate{border:2px solid var(--hl-b);background:var(--hl);border-radius:12px;padding:12px;margin:10px 0}
.gate b{display:block;font-size:15px}
.lbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:6px 11px;font-size:13px;color:var(--ink)}
.lbtn.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
.lbtn:disabled{opacity:.5}
.blocked{border:1px solid var(--alert);background:var(--bad-bg);color:var(--bad-fg);border-radius:10px;padding:10px;margin:8px 0}

/* advisor 360 */
.a360-head{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px}
.a360-head .big{width:54px;height:54px;border-radius:50%;background:#16304a;color:#fff;font-weight:800;font-size:19px;display:grid;place-items:center;flex:none}
.a360-head b{display:block;font-size:17px}
.a360-head small{display:block;color:var(--mute);font-size:12.5px}
.a360-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.a360-meta span{font-size:11.5px;background:var(--soft);border-radius:5px;padding:1px 7px;color:var(--mute)}
.psec{margin-top:12px;background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.psec h4{margin:0;padding:8px 12px;font-size:12.5px;background:var(--soft);display:flex;justify-content:space-between;color:var(--mute)}
.pf{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:7px 12px;border-top:1px solid var(--rule);font-size:13px}
.pf:first-of-type{border-top:0}
.pf dt{color:var(--mute);font-size:12px}
.pf dd{margin:0}
.pf .src{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.pf.upd{background:var(--hl)}
.pf.upd .src{color:var(--hl-fg);font-weight:600}
.pf.fresh{animation:fresh 2.4s ease}
@keyframes fresh{0%{background:var(--hl-strong)}100%{background:var(--hl)}}
.pf .was{display:block;font-size:11.5px;color:var(--mute);text-decoration:line-through}

/* foundation pane */
.fcomp{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:9px 11px;margin-top:9px}
.fcomp.hot{border-color:var(--hl-b);box-shadow:0 0 0 3px rgba(231,181,78,.22)}
.fch{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.fch .fi{width:28px;height:28px;border-radius:8px;background:#16304a;color:var(--gold);display:grid;place-items:center;flex:none}
.fch b{display:block;font-size:14px}
.fch small{display:block;font-size:11.5px;color:var(--mute)}
.fch .cnt{margin-left:auto;font-size:11.5px;color:var(--mute);white-space:nowrap;text-align:right}
.fch .cnt b{color:var(--hl-fg);font-size:14px;display:inline}
.chg{font-size:12.5px;border-top:1px solid var(--rule);padding:5px 0;display:grid;grid-template-columns:auto 1fr;gap:6px}
.chg:first-of-type{margin-top:6px}
.chg .by{font-size:11px;color:var(--mute)}
.chg.fresh{background:var(--hl)}
.op{font-size:10px;font-weight:800;border-radius:4px;padding:0 5px;height:17px;line-height:17px}
.op.add{background:#e3f5ec;color:#1f7a51}
.op.upd{background:#fff0d9;color:#8a5a00}
.op.rel{background:#e3eefb;color:#23548a}
.graphbox{background:var(--s1);border-radius:10px;margin-top:6px;overflow:hidden}
.graphbox svg{display:block;width:100%;height:auto}
.gn text{font:600 13px var(--ui);fill:var(--nt)}
.gn.new circle{stroke:var(--gold);stroke-width:3}
.gn.new text{fill:#fff}
.ge{stroke:var(--sl2);stroke-width:1.4}
.ge.new{stroke:var(--gold);stroke-width:2.2}
.gel{font:500 10.5px var(--ui);fill:var(--nm)}
.gel.new{fill:var(--gold)}

/* artifacts */
.agrid{display:flex;flex-direction:column;gap:8px}
.acard2{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:9px 11px;text-align:left;width:100%}
.acard2:hover{border-color:var(--mute)}
.acard2 b{display:block;font-size:14px}
.acard2 small{display:block;color:var(--mute);font-size:12px}
.acard2.fresh{border-color:var(--hl-b);background:var(--hl)}
.preview{border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--card);margin-top:6px}

/* artifact renders (always light, like the real apps) */
.art{background:#fff;color:#1d2733;font:13px/1.45 'Segoe UI',var(--ui);color-scheme:light}
.ol-bar{background:#0f6cbd;color:#fff;padding:6px 12px;font-size:12px;display:flex;justify-content:space-between}
.ol-h{padding:10px 14px;border-bottom:1px solid #e3e6ea}
.ol-h h5{margin:0 0 6px;font-size:16px;font-weight:600}
.ol-h div{font-size:12.5px;color:#424b57}
.ol-b{padding:12px 14px}
.ol-b p{margin:0 0 8px}
.ol-b ul{margin:0 0 8px;padding-left:18px}
.att{display:inline-flex;align-items:center;gap:8px;border:1px solid #d6dbe1;border-radius:6px;padding:6px 10px;font-size:12px;margin-top:4px}
.att i{width:24px;height:28px;background:#d9382c;border-radius:3px;color:#fff;font:700 8px var(--ui);display:grid;place-items:center;font-style:normal}
.att.link i{background:#1b8a5a}
.sig{color:#5a6573;font-size:12px}
.op1{padding:16px 18px;font-size:12px}
.op1 .brandrow{display:flex;justify-content:space-between;font-size:10.5px;color:#5a6573;border-bottom:3px solid #16304a;padding-bottom:5px;margin-bottom:8px}
.op1 h5{font:600 19px/1.15 var(--serif);margin:0 0 3px;color:#16304a}
.op1 .for{font-size:11px;color:#5a6573;margin-bottom:8px}
.op1 table{width:100%;border-collapse:collapse;font-size:11.5px;margin:4px 0 8px}
.op1 th,.op1 td{border-bottom:1px solid #e3e6ea;padding:4px 5px;text-align:left}
.op1 th{background:#f1f4f7;font-weight:600}
.op1 td.n{text-align:right;font-variant-numeric:tabular-nums}
.op1 h6{margin:8px 0 3px;font-size:12px;color:#16304a}
.op1 ol{margin:0;padding-left:16px}
.op1 .live{display:inline-block;border:1px dashed #9aa8b6;color:#5a6573;border-radius:4px;padding:0 5px;font-size:10.5px}
.op1 .disc{font-size:9.5px;color:#6a7580;border-top:1px solid #e3e6ea;margin-top:8px;padding-top:6px}
.op1 .stamp{float:right;border:2px solid #1f7a51;color:#1f7a51;font-weight:800;font-size:10px;padding:1px 6px;border-radius:4px;transform:rotate(-2deg)}
.sp-top{background:#1d1d3a;color:#fff;padding:7px 12px;font-size:12px;display:flex;gap:8px;align-items:center}
.sp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.sp-card{border:1px solid #dfe3e8;border-radius:8px;padding:8px;font-size:11.5px}
.sp-card .th{height:52px;border-radius:5px;background:linear-gradient(135deg,#dfe7ef,#c6d3e0);margin-bottom:6px;position:relative}
.sp-card.pick{border:2px solid #0f6cbd;box-shadow:0 0 0 3px rgba(15,108,189,.15)}
.sp-card .why{color:#5a6573;margin-top:4px}
.sp-card .tag{display:inline-block;font-size:10px;border-radius:4px;padding:0 5px;margin-top:4px}
.tag.ok{background:#e3f5ec;color:#1f7a51}
.tag.no{background:#fde9e5;color:#b23a26}
.cal{display:grid;grid-template-columns:70px 1fr;gap:6px;padding:12px 14px}
.cal .d{background:#0f6cbd;color:#fff;border-radius:8px;text-align:center;padding:8px 4px;font-weight:700}
.cal .d small{display:block;font-weight:500;font-size:11px}
.sf-h{background:#032d60;color:#fff;padding:8px 12px;font-size:12px;display:flex;gap:8px;align-items:center}
.sf-b{padding:10px 12px}
.sf-row{display:grid;grid-template-columns:120px 1fr;font-size:12px;padding:4px 0;border-bottom:1px solid #eef0f2}
.sf-row span:first-child{color:#5a6573}
.sf-task{display:flex;gap:8px;align-items:center;font-size:12px;padding:5px 0;border-bottom:1px solid #eef0f2}
.sf-task i{width:14px;height:14px;border:1.5px solid #0f6cbd;border-radius:3px;flex:none}
.doc2{padding:14px 16px}
.doc2 h5{font:600 17px var(--serif);margin:0 0 6px;color:#16304a}
.doc2 h6{margin:10px 0 4px;font-size:12px;color:#16304a}
.doc2 ul,.doc2 ol{margin:0;padding-left:18px}
.doc2 li{margin:2px 0}
.planlist{list-style:none;padding:0;margin:0}
.planlist li{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid #eef0f2;font-size:12.5px}
.planlist .dep{font-size:11px;color:#5a6573}
.chk{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;padding:3px 0}
.chk .ok{color:#1f7a51}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(6,16,28,.45);z-index:40}
.scrim[hidden]{display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--card);color:var(--ink);z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.25);animation:slide .25s ease}
.drawer[hidden]{display:none}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--rule)}
.dhead h2{margin:0;font-size:19px;flex:1;display:flex;align-items:center;gap:10px}
.x{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.dbody{flex:1;overflow:auto;padding:16px 20px 40px}
.dtabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin:0 -20px 12px;padding:0 20px}
.dtab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;font-weight:600;font-size:13.5px;color:var(--mute);margin-bottom:-1px}
.dtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.lead{font:400 19px/1.4 var(--serif);margin:0 0 10px}
.flow{display:flex;gap:6px;align-items:stretch;overflow-x:auto;padding-bottom:4px}
.fbox{flex:1;min-width:120px;border:1px solid var(--rule);border-radius:10px;padding:8px;background:var(--soft);font-size:12px}
.fbox b{display:block;font-size:12.5px;margin-bottom:4px}
.fbox ul{margin:0;padding-left:14px}
.fbox li{margin:2px 0}
.farrow{align-self:center;color:var(--mute);font-size:18px}
.ifc{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--rule)}
.ifc code{font:12px var(--code)}
.ifc small{grid-column:2;color:var(--mute)}
.guard{display:flex;gap:8px;font-size:13px;padding:3px 0}
.guard .ic{color:var(--ok);margin-top:3px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px}
.kv dt{color:var(--mute)}
.kv dd{margin:0}
.rcard{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;margin:5px 0;background:var(--soft);font-size:13px;text-align:left;width:100%;display:block;color:var(--ink)}
.rcard small{display:block;color:var(--mute);font-size:11.5px}
.tree ul{list-style:none;margin:0;padding-left:16px;border-left:1px dashed var(--rule)}
.tree>ul{padding-left:0;border:0}
.tree li{margin:5px 0}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(6,16,28,.6)}
.modal[hidden]{display:none}
.mcard{background:var(--card);color:var(--ink);border-radius:18px;max-width:640px;width:100%;max-height:100%;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.mtop{padding:20px 22px 12px;background:var(--night);color:var(--nt);border-radius:18px 18px 0 0}
.mtop h2{font:500 28px var(--serif);margin:0 0 4px;color:#fff}
.mtop p{margin:0;color:var(--nm);font-size:14px}
.mbody{padding:14px 22px 20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#10243a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* lab */
.lab h2{font:500 25px/1.15 var(--serif);margin:0 0 6px}
.labbig b{font:500 44px/1 var(--serif);color:var(--bad-fg)}
.labbig.ok b{color:var(--hl-fg)}
.labrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;width:100%;text-align:left;border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:8px 10px;margin-top:6px;color:var(--ink)}
.labrow small{display:block;color:var(--mute);font-size:12px}
.labrow em{display:block;font-style:normal;color:var(--bad-fg);font-size:12.5px;margin-top:3px}
.labrow .sw{width:30px;height:18px;border-radius:99px;background:var(--gold);position:relative}
.labrow .sw::after{content:'';position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff}
.labrow.off{border-color:var(--bad-b);background:var(--bad-bg)}
.labrow.off .sw{background:#c3ccd5}
.labrow.off .sw::after{right:14px}

/* intro */
.intro{position:fixed;inset:0;z-index:60;background:radial-gradient(90% 80% at 30% 30%,var(--s3),var(--night) 60%,var(--s0));color:var(--nt);overflow:auto;padding:28px 20px}
.intro[hidden]{display:none}
.intro-in{max-width:1120px;margin:0 auto;min-height:100%;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.who{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.bigav{width:52px;height:52px;border-radius:50%;background:#e6edf4;color:#16304a;font-weight:800;display:grid;place-items:center;font-size:18px}
.who b{display:block;color:#fff;font-size:16px}
.who span{font-size:13px;color:var(--nm)}
.bubble{background:#fff;color:#16304a;border-radius:22px 22px 22px 6px;padding:18px 20px;font:400 21px/1.4 var(--serif);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.bubble-meta{font-size:12.5px;color:var(--nm);margin:10px 0 0}
.intro h1{font:400 clamp(36px,4.6vw,60px)/1.02 var(--serif);color:#fff;margin:0 0 14px;letter-spacing:-.02em}
.lede{font-size:16.5px;color:var(--nm);margin:0 0 16px}
.intro-steps{margin:0 0 22px;padding-left:18px;color:var(--nt);font-size:14.5px}
.intro-steps li{margin:5px 0}
.intro-cta{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pbtn.big{font-size:16.5px;padding:13px 26px}
.intro-link{background:none;border:0;color:var(--nt);text-decoration:underline;text-underline-offset:3px}
.mnav{display:none}

@media (max-width:1280px){.main{grid-template-columns:minmax(0,1fr) 380px}.stat{min-width:70px;padding:0 8px}.tlabel{display:none}}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.chap span{display:none}}
@media (max-width:860px){
  .top{flex-wrap:wrap}.stats{order:3;width:100%;margin:0}.brand-word{font-size:15px}
  .main{grid-template-columns:1fr}
  .app[data-view="live"] .rail{display:none}
  .app:not([data-view="live"]) .stage{display:none}
  .tabs{display:none}
  .diagram{overflow:visible;flex:none}
  .stage{overflow:auto}
  .journey{flex-direction:column}.acard{flex:none}.chaps{display:none}
  .lanes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .systems{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gw .legend{display:none}
  .controls{position:sticky;bottom:0;background:rgba(11,27,44,.95);z-index:5}
  #holdBtn,.pbtn.unplug{display:none}
  .mnav{display:flex;background:var(--card);border-top:1px solid var(--rule);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .mnav button{flex:1;background:none;border:0;padding:10px 0;font-size:12.5px;color:var(--mute)}
  .mnav button[aria-current="true"]{color:var(--ink);font-weight:700}
  .intro-in{grid-template-columns:1fr;gap:22px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.mnow{display:none}
@media (max-width:860px){.mnow{display:flex;gap:8px;align-items:center;font-size:13px;background:rgba(255,210,122,.1);border:1px solid rgba(255,210,122,.4);border-radius:10px;padding:6px 10px}.mnow:empty{display:none}}

/* routed wires */
.bus{fill:none;stroke:rgba(255,210,122,.28);stroke-width:2;stroke-dasharray:2 6}
.bus.b2{stroke:rgba(160,190,220,.25)}
.wbase{fill:none;stroke-width:6;opacity:.16;stroke-linecap:round;stroke-linejoin:round}
.wflow{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 9;animation:flow .55s linear infinite;opacity:.95}
.wflow.back{stroke-dasharray:6 6;animation-duration:.9s}
@keyframes flow{from{stroke-dashoffset:10}to{stroke-dashoffset:0}}
.wend{filter:drop-shadow(0 0 4px currentColor)}
.pt{filter:drop-shadow(0 0 6px currentColor)}
/* ===== Live app additions ===== */
.stage{position:relative}
.cmd{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:14px;border:1px solid rgba(255,210,122,.45);background:rgba(255,210,122,.06)}
.cmd-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.who-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--nt);border-radius:99px;padding:3px 10px 3px 4px;font-size:12px}
.who-chip i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:9.5px;color:var(--night)}
.who-chip[aria-pressed="true"]{border-color:var(--acc-t);background:rgba(255,210,122,.14);color:var(--sw)}
.who-chip small{color:var(--nm)}
.cmd-row{display:flex;gap:8px;align-items:stretch}
.cmd-in{flex:1;min-width:0;background:var(--s0);border:1px solid var(--sl2);border-radius:10px;color:var(--sw);font:15px/1.4 var(--ui);padding:9px 12px;resize:none;height:44px}
.cmd-in:focus{outline:2px solid var(--gold);outline-offset:0}
.runbtn{border:0;border-radius:10px;background:var(--gold);color:#1a2a3a;font-weight:700;padding:0 18px;display:inline-flex;align-items:center;gap:7px}
.runbtn:disabled{opacity:.5}
.stopbtn{border:1px solid var(--line);border-radius:10px;background:none;color:var(--nt);padding:0 12px}
.sugs{display:flex;gap:6px;flex-wrap:wrap}
.sug{border:1px dashed var(--line);background:none;color:var(--nm);border-radius:99px;padding:2px 10px;font-size:11.5px}
.sug:hover{color:var(--sw);border-color:#7fa6cc}
.sug.rec{border-style:solid;border-color:rgba(127,212,171,.5);color:#bff0d6}
.aistat{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--nm);border:1px solid var(--line);border-radius:99px;padding:3px 10px;margin-left:10px;white-space:nowrap}
.aistat i{width:8px;height:8px;border-radius:50%;background:var(--nm)}
.aistat.live i{background:var(--product);box-shadow:0 0 8px var(--product)}
.aistat.off i{background:var(--gold)}
/* orchestration band */
.orch{display:block}
.ohead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.othink{margin-top:6px;font-size:12.5px;color:var(--nt);min-height:18px;display:flex;gap:8px;align-items:center}
.othink .spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--gold);border-right-color:transparent;animation:rot 1s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.dchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.dchip{font-size:11.5px;border:1px solid var(--sl2);border-radius:8px;padding:2px 8px;color:var(--nt);background:rgba(255,255,255,.04)}
.dchip b{color:var(--acc-t);font-weight:700;margin-right:4px}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}
.tchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;align-items:center}
.tchip{font-size:11.5px;border-radius:99px;padding:2px 10px 2px 7px;border:1px dashed var(--line);color:var(--nm);display:inline-flex;gap:5px;align-items:center}
.tchip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tchip.running{border-style:solid;border-color:var(--acc-t);color:var(--acc-t)}
.tchip.done{border-style:solid;border-color:var(--sl2);color:var(--nt)}
.tchip.failed{border-color:var(--alert);color:#ffb4a6}
.tchip .arr{color:var(--nm)}
/* lanes of 37 */
.lane .pills{display:grid;grid-template-columns:1fr 1fr;gap:4px 6px}
.pill{display:flex;align-items:center;gap:6px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);padding:3px 6px;font-size:11.5px;color:var(--st2);text-align:left;min-width:0;transition:all .25s}
.pill span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c);opacity:.4;flex:none}
.pill.planned{border-color:var(--c);color:var(--sw);background:rgba(255,255,255,.07)}
.pill.planned i{opacity:1}
.pill.running{border-color:var(--acc-t);background:var(--s3);color:var(--sw);box-shadow:0 0 0 2px rgba(255,210,122,.3)}
.pill.done{border-color:var(--c);color:var(--sw)}
.pill.notified{animation:notif 1.6s ease}
@keyframes notif{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 3px rgba(185,165,245,.6)}}
.lane h3 small{margin-left:auto;font-weight:500;color:var(--nm);font-size:11px}
.tile{min-height:104px}
.tile .tl{-webkit-line-clamp:2}
.tile .cnt{font-size:11px;color:var(--st2)}
.tile .cnt b{color:var(--acc-t)}
/* right rail panes */
.dcard{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:9px 11px;margin-bottom:7px}
.dcard .dt{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mute);font-weight:700;text-transform:none}
.dcard .dt .tag2{font-size:10.5px;font-weight:800;border-radius:5px;padding:0 6px;background:var(--soft);color:var(--mute)}
.dcard .dt .tag2.ai{background:#e3eefb;color:#23548a}
.dcard .dt .tag2.code{background:#e3f5ec;color:#1f6b48}
.dcard b.tt2{display:block;font-size:14px;margin-top:2px}
.dcard p{margin:3px 0 0;font-size:13px}
.dcard .uses{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.dcard .uses span{font-size:11px;border:1px solid var(--rule);border-radius:5px;padding:0 5px;color:var(--mute)}
.stream{font:12px/1.45 var(--code);white-space:pre-wrap;background:var(--soft);border:1px solid var(--rule);border-radius:10px;padding:8px;max-height:130px;overflow:auto;color:var(--mute)}
.task{display:block}
.tcard{background:var(--card);border:1px solid var(--rule);border-radius:12px;margin-bottom:8px;overflow:hidden}
.tcard.running{border-color:var(--hl-b);box-shadow:0 0 0 3px rgba(231,181,78,.18)}
.tcard>summary{list-style:none;cursor:pointer;display:flex;gap:9px;align-items:center;padding:9px 11px}
.tcard>summary::-webkit-details-marker{display:none}
.tcard>summary b{display:block;font-size:14px}
.tcard>summary small{display:block;font-size:12px;color:var(--mute)}
.tcard .st{margin-left:auto;font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;background:var(--soft);color:var(--mute);white-space:nowrap}
.tcard .st.running{background:var(--hl);color:var(--hl-fg)}
.tcard .st.done{background:#e3f5ec;color:#1f7a51}
.tcard .st.failed{background:var(--bad-bg);color:var(--bad-fg)}
.tbody{padding:0 11px 11px}
.sec{margin-top:8px}
.sec>b{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);margin-bottom:4px}
.pk{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12.5px;padding:4px 0;border-top:1px solid var(--rule)}
.pk:first-of-type{border-top:0}
.pk .lid{font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;background:var(--soft);color:var(--mute);height:17px;line-height:17px;white-space:nowrap}
.pk small{grid-column:2;color:var(--mute);font-size:11px}
.wh{font-size:12px;color:var(--bad-fg);background:var(--bad-bg);border-radius:6px;padding:3px 7px;margin-top:3px}
.vd{display:grid;grid-template-columns:auto 1fr;gap:6px;font-size:12.5px;padding:5px 0;border-top:1px solid var(--rule);align-items:start}
.vd:first-of-type{border-top:0}
.vb{font-size:10px;font-weight:800;border-radius:4px;padding:1px 6px;white-space:nowrap}
.vb.published,.vb.committed{background:#e3f5ec;color:#1f7a51}
.vb.pending,.vb.approval,.vb.task{background:#fff0d9;color:#8a5a00}
.vb.rejected,.vb.blocked,.vb.failed{background:#fde9e5;color:#b23a26}
.vb.read{background:#e3eefb;color:#23548a}
.vd small{display:block;color:var(--mute)}
.says{font:400 15px/1.45 var(--serif);margin:6px 0}
.outbody{font-size:13px;white-space:pre-wrap;background:var(--soft);border-radius:8px;padding:8px 10px}
.memsec{margin-top:10px;background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.memsec h4{margin:0;padding:7px 11px;font-size:12.5px;background:var(--soft);color:var(--mute);display:flex;justify-content:space-between}
.mrow{padding:7px 11px;border-top:1px solid var(--rule);font-size:13px}
.mrow:first-of-type{border-top:0}
.mrow b{display:block}
.mrow small{display:block;font-size:11.5px;color:var(--mute)}
.mrow.old{opacity:.55;text-decoration:line-through}
.mrow.pend{background:var(--hl)}
.mrow.hl{background:var(--hl)}
.change{border:1px solid var(--hl-b);background:var(--hl);border-radius:12px;padding:9px 11px;margin-top:8px;font-size:13px}
.change .h2{font-size:11px;font-weight:800;color:var(--hl-fg);letter-spacing:.04em}
.change .bf{color:var(--mute);text-decoration:line-through;display:block}
.advsel{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.ego{background:var(--s1);border-radius:12px;margin-top:8px}
.ego svg{display:block;width:100%;height:auto}
.ego text{font:600 11px var(--ui);fill:var(--nt)}
.summary{border:1.5px solid var(--hl-b);background:var(--hl);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.summary h3{margin:0 0 4px;font:500 19px var(--serif)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.sgrid div{font-size:11.5px;color:var(--mute)}
.sgrid b{display:block;font-size:18px;color:var(--ink)}
.clar{border:2px solid var(--hl-b);background:var(--hl);border-radius:12px;padding:10px;margin-bottom:8px}
.clar input{width:100%;margin-top:6px;border:1px solid var(--rule);border-radius:8px;padding:7px 9px;font:inherit;background:var(--card);color:var(--ink)}
.empty{color:var(--mute);font-size:13.5px;padding:16px 4px}
.olk{border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:#fff;color:#1d2733}
.olk .bar{background:#0f6cbd;color:#fff;padding:5px 10px;font-size:12px;display:flex;justify-content:space-between}
.olk .bd{padding:10px 12px;font-size:13px;white-space:pre-wrap}

.pk small{display:block}
.pk .vbadge{align-self:start}
.stat{min-width:64px}
.vb.flagged{background:#fff0d9;color:#8a5a00}

/* smooth, flicker-free updates */
.enter{animation:enter .4s ease both}
@keyframes enter{from{opacity:0;transform:translateY(4px)}}
.pane>*{transition:background-color .4s,border-color .4s,opacity .4s}
/* orchestration pipeline */
.ohead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.oreq{font-size:12.5px;color:var(--nt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.oreq small{color:var(--nm);margin-left:6px}
.pipe{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.pstep{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--nm);border:1px solid var(--line);border-radius:99px;padding:2px 10px 2px 3px;transition:all .35s ease}
.pstep i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:800;background:rgba(255,255,255,.06);transition:all .35s ease}
.pstep i .ic{width:11px;height:11px;stroke-width:3}
.pstep.active{color:var(--acc-t);border-color:var(--acc-t);background:rgba(255,210,122,.1)}
.pstep.active i{background:var(--gold);color:#1a2a3a}
.pstep.done{color:var(--nt);border-color:var(--sl2)}
.pstep.done i{background:#2f9e6c;color:var(--sw)}
.pstep.skipped{opacity:.45}
.pstep.failed{border-color:var(--alert);color:#ffb4a6}
.othink{margin-top:7px;font-size:12.5px;color:var(--nt);min-height:18px;display:flex;gap:6px;align-items:center}
.othink b{color:var(--sw)}
/* step cards */
.scard{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:8px 11px;margin-bottom:6px}
.scard.pending{opacity:.55}
.scard.skipped{opacity:.5}
.scard.active{border-color:var(--hl-b);box-shadow:0 0 0 3px rgba(231,181,78,.16)}
.scard .sh{display:flex;align-items:center;gap:8px;font-size:13.5px}
.scard .sh small{margin-left:auto;color:var(--mute);font-size:11.5px}
.scard .sn{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--soft);color:var(--mute);flex:none}
.scard.done .sn{background:#e3f5ec;color:#1f7a51}
.scard.active .sn{background:var(--hl)}
.scard .sb{margin-top:6px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:7px;font-size:13px;padding:4px 0;border-top:1px solid var(--rule);align-items:start}
.dl:first-child{border-top:0}
.dl small{display:block;color:var(--mute);font-size:11.5px;margin-top:1px}
.dl .tag2{font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 5px;margin-top:2px;white-space:nowrap}
.tag2.ai{background:#e3eefb;color:#23548a}
.tag2.code{background:#e3f5ec;color:#1f6b48}
.tid{min-width:22px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:var(--night);padding:0 4px}
.spin{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--gold);border-right-color:transparent;animation:rot 1s linear infinite;vertical-align:-1px}
@keyframes rot{to{transform:rotate(360deg)}}
/* curved, translucent flows drawn over the diagram */
.wires{mix-blend-mode:screen}
.wbase{fill:none;stroke-width:5;opacity:.1;stroke-linecap:round}
.wflow{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:2 8;animation:flow .6s linear infinite;opacity:.8}
.wflow.call{stroke-dasharray:6 6;opacity:.65}
.wflow.handoff{stroke-width:2.4;stroke-dasharray:8 6;opacity:.9}
.pt{filter:drop-shadow(0 0 6px currentColor)}
.bus{display:none}

/* knowledge graph: compact card */
.kgwrap{margin-top:10px}
.kgcard{background:var(--s1);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.kgcard-h{display:flex;align-items:center;gap:8px;padding:8px 10px;color:var(--nt);font-size:12px}
.kgcard-h b{font-size:13px;color:var(--sw)}
.kgcard-h span{color:var(--nm);flex:1}
.kgcard-h em{font-style:normal;color:var(--acc-t)}
.kgcard-h .lbtn{background:rgba(255,210,122,.12);border-color:rgba(255,210,122,.5);color:var(--gold);padding:3px 10px}
.kgmini{display:block;width:100%;height:auto;cursor:zoom-in}
/* graph drawing */
.kghl{font:700 14px var(--ui);letter-spacing:.02em}
.kgl{font:600 13px var(--ui);fill:var(--nt)}
.kgs{font:500 11px var(--ui);fill:var(--st2)}
.kgbadge{font:800 9.5px var(--ui);fill:#1a2a3a;paint-order:stroke;stroke:#ffd27a;stroke-width:9px;stroke-linejoin:round;letter-spacing:.06em}
.kgci{font:800 26px var(--ui);fill:#16304a}
.kgcn{font:500 22px var(--serif);fill:var(--sw)}
.kgcs{font:500 12.5px var(--ui);fill:var(--st2)}
.kgn{cursor:pointer}
.kgn:hover circle:not(.kgpulse),.kgn.sel circle:not(.kgpulse){stroke:var(--sw);stroke-width:3}
.kgn.superseded .kgl{text-decoration:line-through;fill:var(--nm)}
.kgn.locked .kgl,.kgn.unknown .kgl{fill:var(--st2);font-style:italic}
.kgn.new .kgl,.kgn.updated .kgl{fill:#ffe3a3}
.kgpulse{animation:kgp 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes kgp{50%{opacity:.05;transform:scale(1.5)}}
.kgx{fill:none;stroke:#c9a8ff;stroke-width:1.4;stroke-dasharray:4 5;opacity:.45;transition:opacity .2s,stroke-width .2s}
.kgx.hi{opacity:1;stroke-width:2.4}
/* full-screen explorer */
.kg{position:fixed;inset:0;z-index:80;background:var(--s0);color:var(--nt);display:grid;grid-template-rows:auto auto 1fr auto;animation:kgin .25s ease}
.kg[hidden]{display:none}
@keyframes kgin{from{opacity:0}}
.kg-top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.kg-title{font:500 20px var(--serif);color:var(--sw)}
.kg-adv{display:flex;gap:5px;flex-wrap:wrap}
.kgchip{border:1px solid var(--line);background:none;color:var(--st2);border-radius:99px;padding:3px 12px;font-size:12.5px}
.kgchip.on{background:var(--gold);border-color:var(--acc-t);color:#1a2a3a;font-weight:700}
.kg-zoom{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kg-zoom button{background:none;border:0;color:var(--nt);padding:4px 11px;font-size:14px}
.kg-zoom button:hover{background:var(--night-2)}
.kg-close{background:var(--night-2);border:0;color:var(--sw);width:34px;height:34px;border-radius:50%;font-size:15px}
.kg-filt{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px}
.kgf{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--nt);border-radius:99px;padding:3px 11px 3px 8px;font-size:12px}
.kgf i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.kgf.off{opacity:.4}
.kgf.off i{background:none;border:1.5px solid var(--c)}
.kgf.tog{border-style:dashed}
.kgf.tog.on{background:rgba(255,210,122,.15);border:1px solid var(--gold);color:var(--acc-t)}
.kg-main{display:grid;grid-template-columns:1fr 360px;min-height:0}
.kg-canvas{position:relative;min-height:0}
#kgsvg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#kgsvg.drag{cursor:grabbing}
.kg-legend{position:absolute;left:14px;bottom:10px;display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--st2);background:rgba(10,24,40,.8);padding:6px 10px;border-radius:10px}
.kg-legend span{display:inline-flex;align-items:center;gap:5px}
.kgdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#6a8bab;flex:none}
.kgdot.new,.kgdot.updated{background:#ffd27a;box-shadow:0 0 8px #ffd27a}
.kgdot.session{background:none;border:2px solid #e8c877}
.kgdot.read{background:none;border:2px solid #7fd4ab}
.kgdot.pending{background:none;border:2px dashed #ffb347}
.kgdot.superseded,.kgdot.locked{background:#3a4d62}
.kgline{display:inline-block;width:20px;border-top:2px dashed #c9a8ff}
.kg-side{border-left:1px solid var(--line);overflow:auto;padding:14px 16px;background:var(--s1)}
.kgd h3{font:500 22px/1.15 var(--serif);color:var(--sw);margin:6px 0 2px}
.kgd h4{font-size:12px;color:var(--nm);margin:16px 0 6px;letter-spacing:.04em}
.kgd p{font-size:13.5px;line-height:1.5;margin:6px 0}
.kgsub{color:var(--st2);font-size:13px}
.kgtag{display:inline-block;font-size:11px;font-weight:800;color:var(--night);border-radius:5px;padding:1px 7px}
.kgstate{display:inline-block;margin:6px 0;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--night-2);color:var(--nt)}
.kgstate.new,.kgstate.updated{background:rgba(255,210,122,.18);color:var(--acc-t)}
.kgstate.pending{background:rgba(255,179,71,.15);color:#ffb347}
.kgstate.read{background:rgba(127,212,171,.15);color:#7fd4ab}
.kgsum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.kgsum div{background:var(--s2);border-radius:10px;padding:7px 8px;font-size:11px;color:var(--st2)}
.kgsum b{display:block;font-size:19px;color:var(--sw)}
.kgsum .g b{color:var(--acc-t)}
.kgsum .a b{color:#ffb347}
.kglink{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;background:var(--s2);border:1px solid var(--line);color:var(--nt);border-radius:10px;padding:7px 9px;margin-top:5px;font-size:13px}
.kglink:hover{border-color:var(--sl2)}
.kglink small{display:block;color:var(--nm);font-size:11.5px}
.kglink .kgdot{margin-top:4px}
.kg-time{border-top:1px solid var(--line);padding:8px 16px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.kg-time>b{font-size:12px;color:var(--nm)}
.kgtl{grid-column:2;font-size:11px;color:var(--nm)}
.kgtrack{position:relative;height:40px;border-bottom:2px solid var(--line)}
.kgtick{position:absolute;bottom:-7px;transform:translateX(-50%);background:none;border:0;color:var(--st2);display:flex;flex-direction:column-reverse;align-items:center;gap:2px;font-size:10.5px;white-space:nowrap}
.kgtick i{width:12px;height:12px;border-radius:50%;background:#b9a5f5;border:2px solid var(--s0)}
.kgtick.ev i{background:var(--gold)}
.kgtick span{max-width:120px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:900px){.kg-main{grid-template-columns:1fr}.kg-side{max-height:38vh;border-left:0;border-top:1px solid var(--line)}}

.kgtrack{height:46px}
.kgtick.lo span{transform:translateY(16px)}
.kgtoday{position:absolute;left:68%;top:0;bottom:-2px;border-left:1px dashed var(--sl2);padding-left:6px;font-size:10.5px;color:var(--acc-t)}

/* ===== Themes ===== */
:root{--s0:#0b1b2c;--s1:#0f2439;--s2:#132c47;--s3:#16375a;--sl2:#4d7aa3;--st2:#aebfd0;--sw:#fff;--acc-t:#ffd27a;
  --stage-bg:radial-gradient(110% 80% at 50% 55%,#16375a 0%,#0f2439 60%,#0b1b2c 100%);
  --w-request:#ffd27a;--w-dispatch:#b9cadb;--w-read:#7fd4ab;--w-write:#ffd27a;--w-handoff:#e2b6ff;--w-mcp:#82b6ff;--w-api:#7fd4ab;--w-blend:screen;--kg-center:#e6edf4;--kg-dim:#3a4d62}
[data-skin="graphite"]{--night:#16181c;--night-2:#1f2227;--night-3:#2a2e34;--line:#30353d;--nt:#e6e8eb;--nm:#9aa1aa;--s0:#0f1013;--s1:#16181c;--s2:#1c1f24;--s3:#262a30;--sl2:#4a5059;--st2:#b5bbc3;--sw:#fff;--acc-t:#f2c46d;--gold:#f2c46d;
  --stage-bg:radial-gradient(110% 80% at 50% 45%,#23262c 0%,#16181c 60%,#0f1013 100%);--kg-dim:#3b4047}
[data-skin="evergreen"]{--night:#0c2a26;--night-2:#123731;--night-3:#18463f;--line:#23524b;--nt:#dcefe9;--nm:#8fb3aa;--s0:#071c19;--s1:#0c2a26;--s2:#10332e;--s3:#164039;--sl2:#3a756c;--st2:#a9c9c1;--sw:#fff;--acc-t:#ffd27a;
  --stage-bg:radial-gradient(110% 80% at 50% 45%,#174a42 0%,#0c2a26 60%,#071c19 100%);--kg-dim:#2e4e49}
[data-skin="porcelain"]{--night:#ffffff;--night-2:#f1f4f7;--night-3:#e6ecf2;--line:#d3dbe4;--nt:#1d3044;--nm:#5f7386;--s0:#eef1f4;--s1:#ffffff;--s2:#f6f8fa;--s3:#e9eff5;--sl2:#a9b8c7;--st2:#4f6376;--sw:#0f2236;--acc-t:#a86a00;
  --stage-bg:linear-gradient(180deg,#f7f8f6 0%,#eef1f4 100%);
  --w-request:#c98a00;--w-dispatch:#6b7f93;--w-read:#1f9e6c;--w-write:#d18a00;--w-handoff:#8a4fd0;--w-mcp:#2f6fd0;--w-api:#1f9e6c;--w-blend:multiply;--kg-center:#16304a;--kg-dim:#c7d0d9}
[data-skin="porcelain"] .top{border-bottom-color:#d3dbe4}
[data-skin="porcelain"] .brand svg rect{fill:#e2a500}
[data-skin="porcelain"] .found{background:linear-gradient(180deg,rgba(226,165,0,.08),rgba(226,165,0,.02));border-color:rgba(200,140,0,.55)}
[data-skin="porcelain"] .fhead b{color:#a86a00}
[data-skin="porcelain"] .cmd{background:#fff;border-color:rgba(200,140,0,.45)}
[data-skin="porcelain"] .pill,[data-skin="porcelain"] .lane{background:#fff;border-color:#e0e6ec}
[data-skin="porcelain"] .pill.planned{background:#f7f9fb}
[data-skin="porcelain"] .pill.running{background:#fff7e3}
[data-skin="porcelain"] .tile.read{background:#effaf4}
[data-skin="porcelain"] .tile.write{background:#fff4dc}
[data-skin="porcelain"] .kgcard,[data-skin="porcelain"] .kg{background:#f5f7f9}
[data-skin="porcelain"] .kgci{fill:#fff}
[data-skin="porcelain"] .kgbadge{fill:#fff;stroke:#c98a00}
[data-skin="porcelain"] .kgn.new .kgl,[data-skin="porcelain"] .kgn.updated .kgl{fill:#a86a00}
[data-skin="porcelain"] .stat.gold b,[data-skin="porcelain"] .ftot b{color:#a86a00}
[data-skin="porcelain"] .who-chip i,[data-skin="porcelain"] .pstep.active i{color:#0e2135}
.wires{mix-blend-mode:var(--w-blend)}
.wflow.request,.wbase.request{stroke:var(--w-request);fill:none}.pt.request{fill:var(--w-request);color:var(--w-request)}
.wflow.dispatch,.wbase.dispatch{stroke:var(--w-dispatch);fill:none}.pt.dispatch{fill:var(--w-dispatch);color:var(--w-dispatch)}
.wflow.read,.wbase.read{stroke:var(--w-read);fill:none}.pt.read{fill:var(--w-read);color:var(--w-read)}
.wflow.write,.wbase.write{stroke:var(--w-write);fill:none}.pt.write{fill:var(--w-write);color:var(--w-write)}
.wflow.handoff,.wbase.handoff{stroke:var(--w-handoff);fill:none}.pt.handoff{fill:var(--w-handoff);color:var(--w-handoff)}
.wflow.mcp,.wbase.mcp{stroke:var(--w-mcp);fill:none}.pt.mcp{fill:var(--w-mcp);color:var(--w-mcp)}
.wflow.api,.wbase.api{stroke:var(--w-api);fill:none}.pt.api{fill:var(--w-api);color:var(--w-api)}
.wbase{fill:none}.wflow{fill:none}
.skinpick{display:flex;gap:4px;align-items:center;margin-right:4px}
.skinpick button{width:18px;height:18px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer}
.skinpick button[aria-pressed="true"]{border-color:var(--acc-t);transform:scale(1.15)}

/* rail follows the theme */
@media (prefers-color-scheme:dark){
  [data-skin="graphite"]:not([data-theme="light"]){--paper:#121316;--card:#1b1d21;--soft:#23262b;--rule:#30343b;--ink:#e8eaed;--mute:#a2a8b0}
  [data-skin="evergreen"]:not([data-theme="light"]){--paper:#081e1b;--card:#0f2c28;--soft:#143632;--rule:#22504a;--ink:#e3f2ee;--mute:#9fbfb7}
}
[data-skin="porcelain"]{--paper:#eef1f4;--card:#fff;--ink:#15304a;--mute:#5f7386;--rule:#d9e1e8;--soft:#f5f7f9;--hl:#fff8e6;--hl-b:#e7b54e;--hl-fg:#8a5a00;--hl-strong:#ffe7a6;--bad-bg:#fff2ef;--bad-fg:#a8321e;--bad-b:#e08a7c}
.kge{fill:none}
[data-skin="porcelain"] .kg-legend{background:rgba(255,255,255,.92);color:#4f6376;border:1px solid #d9e1e8}
[data-skin="porcelain"] .kghl{filter:brightness(.62) saturate(1.3)}
[data-skin="porcelain"] .kgs{fill:#5f7386}
[data-skin="porcelain"] .integ{background:#fff}
[data-skin="porcelain"] .kg-top,[data-skin="porcelain"] .kg-time,[data-skin="porcelain"] .kg-side{border-color:#d9e1e8}
[data-skin="porcelain"] .kg-side{background:#fff}
[data-skin="porcelain"] .kgsum div,[data-skin="porcelain"] .kglink{background:#f3f6f9;border-color:#e0e6ec;color:#1d3044}
[data-skin="porcelain"] .kgd h3{color:#15304a}

/* ===== Workbench board ===== */
.bcol{gap:6px}
.bcol h3 small{margin-left:auto;font-weight:500;color:var(--nm);font-size:11px}
.brole{border:1px solid var(--line);border-radius:10px;padding:6px 7px;background:rgba(255,255,255,.02);transition:border-color .3s,box-shadow .3s}
.brole.has{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.brole.busy{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent)}
.brole.notified{animation:notif 1.6s ease}
.brh b{display:block;font-size:12.5px;color:var(--nt)}
.brh small{display:block;font-size:10.5px;color:var(--nm);line-height:1.3}
.btasks{display:flex;flex-direction:column;gap:5px;margin-top:5px}
.btasks:empty{display:none}
.bcard-in{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--s2);color:var(--nt);border-radius:8px;padding:6px 8px;font-size:12px;cursor:pointer;transition:border-color .3s,background .3s}
.bcard-in:hover{border-color:var(--sl2)}
.bcard-in b{display:block;font-size:12.5px;line-height:1.3;margin-top:2px;color:var(--sw)}
.bcard-in small{display:block;font-size:10.5px;color:var(--nm);margin-top:2px}
.bcard-in small.bout{color:var(--st2);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bst{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--nm);font-style:normal}
.bst i{width:7px;height:7px;border-radius:50%;background:currentColor}
.bcard.running .bcard-in{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--s2))}
.bcard.running .bst{color:var(--acc-t)}
.bcard.running .bst i{animation:blinkdot 1s ease-in-out infinite}
@keyframes blinkdot{50%{opacity:.25}}
.bcard.done .bst{color:#5fd3a0}
.bcard.approval .bst{color:var(--acc-t)}
.bcard.failed .bst,.bcard.blocked .bst{color:var(--alert)}
.bcard.done .bcard-in{border-color:color-mix(in srgb,#5fd3a0 45%,var(--line))}
/* Updates feed */
.ustat{display:flex;gap:8px;align-items:center;font-size:13px}
.ua{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--rule);font-size:13px}
.ua:first-of-type{border-top:0}
.ua i,.uh i{width:9px;height:9px;border-radius:50%}
.ua small,.uh small{display:block;color:var(--mute);font-size:11.5px}
.ua .bst,.uh .bst{white-space:nowrap}
.ua .bst.done,.uh .bst.done{color:#1f7a51}
.ua .bst.running,.ua .bst.approval,.uh .bst.approval{color:var(--hl-fg)}
.ua .bst.failed,.ua .bst.blocked,.uh .bst.failed,.uh .bst.blocked{color:var(--bad-fg)}
.uh{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13.5px}
.uout .says{margin:8px 0 2px;font-size:14.5px}
.uv{font-size:12.5px;padding:4px 8px;border-radius:6px;margin-top:5px;background:var(--soft)}
.uv.published,.uv.committed{background:#e3f5ec;color:#1f6b48}
.uv.pending,.uv.task{background:var(--hl);color:var(--hl-fg)}
.uv.rejected,.uv.blocked{background:var(--bad-bg);color:var(--bad-fg)}
@media (prefers-color-scheme:dark){:root:not([data-skin="porcelain"]) .uv.published,:root:not([data-skin="porcelain"]) .uv.committed{background:#143a2a;color:#9fe3c2}}

.brh small{display:none}
.brole{padding:5px 7px}
.brh b{font-size:12px}
.bcol{gap:5px}

.bwho{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--nm);margin-top:2px}
.bwho .ic{width:11px;height:11px}

.plancard .ask{margin-top:8px}
.askh{display:flex;align-items:center;gap:8px;font-size:13.5px}
.askn{width:20px;height:20px;border-radius:6px;background:var(--soft);border:1px solid var(--rule);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.steprow{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;width:100%;text-align:left;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 9px;margin:5px 0 0 28px;width:calc(100% - 28px)}
.finalcard .steprow{margin-left:0;width:100%}
.steprow:hover{border-color:var(--mute)}
.stepn{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#0e2135;flex:none}
.stepn.big{width:30px;height:30px;font-size:14px;display:inline-grid;margin-right:4px}
.stepb b{display:block;font-size:13px}
.stepb small{display:block;font-size:11.5px;color:var(--mute)}
.stepb .agentline{color:var(--mute);font-style:italic}
.openlink{font-style:normal;font-size:12px;font-weight:700;color:var(--hl-fg)}
.ohd{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute)}
.fulfills{margin-top:10px;border-left:3px solid var(--hl-b);background:var(--hl);border-radius:0 8px 8px 0;padding:7px 10px}
.fulfills small{display:block;font-size:11px;color:var(--hl-fg);font-weight:700}
.fulfills b{font:400 15px/1.4 var(--serif)}

/* agents inside each role: quiet, grayscale */
.bagents{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.bag{font-size:10px;line-height:1.5;padding:0 6px;border-radius:5px;border:1px solid var(--line);color:var(--nm);opacity:.55;filter:grayscale(1);white-space:nowrap;transition:opacity .3s,border-color .3s}
.bag.planned{opacity:.8;border-style:dashed;border-color:var(--sl2)}
.bag.act{opacity:1;border-color:var(--st2);color:var(--nt)}
.bag.act::before{content:'';display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;border:1.5px solid var(--st2);border-right-color:transparent;animation:rot 1s linear infinite;vertical-align:-1px}
.bag.used{opacity:.9;color:var(--st2)}
.bag.used::before{content:'✓ ';font-weight:700}

/* Layout: outputs on the left, the live diagram on the right with the remaining width */
@media (min-width:861px){
  .main{grid-template-columns:400px minmax(0,1fr)}
  .rail{order:-1;border-left:0;border-right:1px solid var(--rule)}
  .app.norail .main{grid-template-columns:minmax(0,1fr)}
  .app.norail .rail{display:none}
}
@media (min-width:861px) and (max-width:1280px){.app:not(.norail) .main{grid-template-columns:360px minmax(0,1fr)}}
.tbtn[aria-pressed="true"] .ic{transform:scaleX(-1)}

/* five tabs fit the narrow rail */
.tabs{overflow-x:auto;scrollbar-width:none}
.tab{padding:9px 8px;font-size:13px;white-space:nowrap;flex:none}

/* traceability: where each step's answer came from */
.srcs{margin-top:8px;border:1px solid var(--rule);border-radius:8px;padding:6px 9px 4px;background:var(--soft)}
.srch{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.srch .ic{width:12px;height:12px}
.srcl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:start;font-size:12.5px;padding:5px 0;border-top:1px solid var(--rule)}
.srch + .srcl{border-top:0}
.srcl .vbadge{margin-top:1px;text-align:center;min-width:34px}
.srcl code{font:11.5px var(--code)}
.srcl small{display:block;color:var(--mute);font-size:11.5px}
.srcl small.bad{color:var(--bad-fg)}

/* closing card: what the requester should do next */
.nextcard{border:1.5px solid var(--hl-b);background:var(--hl)}
.nextcard .dt{color:var(--hl-fg)}
.nxgoal{font:400 15px/1.4 var(--serif);margin:6px 0 4px}
.nxgoal small{display:block;font:12px/1.4 inherit;font-family:inherit;color:var(--mute)}
.nx{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:13.5px;padding:6px 0;border-top:1px solid var(--hl-b)}
.nx small{display:block;color:var(--mute);font-size:11px}
.nxt{font-size:10px;font-weight:800;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--card);color:var(--ink);border:1px solid var(--rule);white-space:nowrap;min-width:62px;text-align:center}
.nxt.next{background:var(--ink);color:var(--card);border-color:var(--ink)}
.nxt.approve{color:var(--hl-fg);border-color:var(--hl-b)}

/* editing a draft before approval */
.editin{width:100%;box-sizing:border-box;margin-top:8px;font:13px/1.5 inherit;font-family:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;resize:vertical}

/* saved runs: play beside the suggestion */
.sugw{display:inline-flex;align-items:center;gap:2px}
.sugrep{border:1px solid rgba(127,212,171,.5);background:none;color:#bff0d6;border-radius:99px;width:20px;height:20px;padding:0;font-size:9px;line-height:1;display:grid;place-items:center}
.sugrep:hover{background:rgba(127,212,171,.15)}
:root[data-skin="porcelain"] .sugrep{color:#1f6b48;border-color:#7fbf9f}

/* eight enterprise systems in two rows */
@media (min-width:861px){.systems{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app" id="app" data-view="live">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="12" width="26" height="8" rx="3" fill="#ffd27a"/><circle cx="8" cy="5" r="3" fill="#82b6ff"/><circle cx="16" cy="5" r="3" fill="#7fd4ab"/><circle cx="24" cy="5" r="3" fill="#f0b870"/><circle cx="16" cy="27" r="3" fill="#b9a5f5"/></svg><span class="brand-word">Connected Client Experience</span></div>
    <div class="stats" id="stats"></div>
    <div class="skinpick" id="skinPick" role="group" aria-label="Theme"></div>
    <div class="top-actions">
      <button class="tbtn" id="railBtn" aria-pressed="false" title="Hide the outputs panel to give the diagram the full width"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9 5v14"/></svg><span class="tlabel">Hide panel</span></button>
      <button class="tbtn" id="sessionBtn" title="End this conversation. Lasting memory stays."><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span class="tlabel">New session</span></button>
      <button class="tbtn" id="resetBtn" title="Reset the foundation to its starting data"><svg class="ic" viewBox="0 0 24 24"><path d="M4 12a8 8 0 108-8 8 8 0 00-6 2.7L4 9M4 4v5h5"/></svg><span class="tlabel">Reset</span></button>
      <button class="tbtn" id="deepBtn" aria-pressed="false" title="Agents use the deeper model: slower, more thorough"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span class="tlabel">Deeper agents</span></button>
      <button class="tbtn" id="helpBtn"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 .5c0 1.5-2.5 2-2.5 3.5M12 17h.01"/></svg><span class="tlabel">How it works</span></button>
    </div>
  </header>
  <main class="main">
    <section class="stage" id="stage">
      <div class="diagram" id="diagram">
        <svg class="wires" id="wires" aria-hidden="true"></svg>
        <div class="row cmd" id="cmd">
          <div class="cmd-top" id="whoRow"></div>
          <div class="cmd-row"><textarea class="cmd-in" id="cmdIn" rows="1" placeholder="Ask for an outcome, in your own words…" aria-label="Request"></textarea><button class="runbtn" id="runBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor" stroke="none"/></svg>Run</button><button class="stopbtn" id="stopBtn" hidden>Stop</button></div>
          <div class="sugs" id="sugs"></div>
        </div>
        <div class="row orch" id="orch" role="button" tabindex="0"></div>
        <div class="row lanes" id="lanes"></div>
        <div class="row found" id="found"></div>
        <div class="row integ" id="integ"></div>
      </div>
    </section>
    <aside class="rail" id="rail">
      <div class="tabs" role="tablist">
        <button class="tab" data-tab="updates" aria-selected="true">Updates<i class="badge"></i></button>
        <button class="tab" data-tab="decisions" aria-selected="false">Decisions<i class="badge"></i></button>
        <button class="tab" data-tab="packets" aria-selected="false">Agents</button>
        <button class="tab" data-tab="memory" aria-selected="false">Memory<i class="badge"></i></button>
        <button class="tab" data-tab="events" aria-selected="false">Events</button>
      </div>
      <div class="panes">
        <div class="pane" id="pane-updates"></div>
        <div class="pane" id="pane-decisions" hidden></div>
        <div class="pane" id="pane-packets" hidden></div>
        <div class="pane" id="pane-memory" hidden></div>
        <div class="pane" id="pane-events" hidden></div>
      </div>
    </aside>
  </main>
  <nav class="mnav" id="mnav"><button data-view="live" aria-current="true">Live</button><button data-view="updates">Updates</button><button data-view="decisions">Decisions</button><button data-view="packets">Agents</button><button data-view="memory">Memory</button><button data-view="events">Events</button></nav>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" hidden><div class="dhead"><h2 id="drawerTitle"></h2><button class="x" id="drawerClose" aria-label="Close"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="dbody" id="drawerBody"></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="kg" id="kg" role="dialog" aria-modal="true" aria-label="Advisor knowledge graph" hidden>
  <div class="kg-top"><b class="kg-title">Advisor knowledge graph</b><div class="kg-adv" id="kgAdv"></div><span class="grow"></span>
    <div class="kg-zoom"><button data-kgact="out" aria-label="Zoom out">−</button><button data-kgact="fit">Fit</button><button data-kgact="in" aria-label="Zoom in">+</button></div>
    <button class="kg-close" data-kgact="close" aria-label="Close">✕</button></div>
  <div class="kg-filt" id="kgFilt"></div>
  <div class="kg-main"><div class="kg-canvas"><svg id="kgsvg" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="kg-legend"><span><i class="kgdot new"></i>New</span><span><i class="kgdot updated"></i>Updated</span><span><i class="kgdot session"></i>Earlier today</span><span><i class="kgdot read"></i>Read, unchanged</span><span><i class="kgdot pending"></i>Pending</span><span><i class="kgdot superseded"></i>Superseded</span><span><i class="kgdot locked"></i>Hidden</span><span><i class="kgline"></i>Evidence</span></div></div>
    <aside class="kg-side" id="kgside"></aside></div>
  <div class="kg-time" id="kgtime"></div>
</div>
<script>/* ===== Reference data: the enterprise as the foundation sees it =====
   People and firms' teams are fictional. Fund facts marked verified come from
   public fund pages (as of the date shown); anything not verified is left null
   so the fund data platform, not the AI, stays the source of numbers. */

const TEAMS = {
  sales: { name: 'Sales', color: '#82b6ff' },
  product: { name: 'Product', color: '#7fd4ab' },
  marketing: { name: 'Marketing', color: '#f0b870' },
  service: { name: 'Service', color: '#b9a5f5' }
};
const TEAM_ORDER = ['sales', 'product', 'marketing', 'service'];

/* Who can type into the command bar */
const EMPLOYEES = {
  'EMP-PRIYA': { name: 'Priya Shah', team: 'sales', role: 'Wholesaler, Southern California (LA, Orange County, San Diego)', covers: ['ADV-101', 'ADV-102', 'ADV-104', 'ADV-105', 'ADV-106'] },
  'EMP-SAM': { name: 'Sam Lee', team: 'sales', role: 'Internal partner, Southern California', covers: ['ADV-101', 'ADV-102', 'ADV-103', 'ADV-104', 'ADV-105', 'ADV-106', 'ADV-107'] },
  'EMP-DANA': { name: 'Dana Ortiz', team: 'product', role: 'Investment product specialist', covers: [] },
  'EMP-MARCUS': { name: 'Marcus Bell', team: 'marketing', role: 'Advisor marketing lead', covers: [] },
  'EMP-KIM': { name: 'Kim Nguyen', team: 'service', role: 'Advisor service', covers: [] }
};

const SUGGESTIONS = {
  sales: ['Identify the growing trends in LA territory', 'Compare BFA and AMBAL for Rachel and schedule a meeting with her next month', 'Prep me for my call with Alex tomorrow', 'Prepare Maya’s retirement committee fee comparison review', 'Sofia mentioned ETFs. What should I bring to our next meeting?', 'Alex said on today’s call he wants the numbers in an appendix from now on. Update his profile.'],
  product: ['Compare BFA and AMBAL: costs, approach and who each suits', 'Why has GFA trailed the Vanguard growth index? I need an explanation advisors can use.', 'Compare GFA F-2 costs with VWUAX and VIGAX on $38M', 'Check whether our fee comparison for Maya is still current'],
  marketing: ['Draft the follow-up email to Alex using Product’s verified comparison', 'Create an ETF email campaign for Sofia', 'Write a LinkedIn post on fee transparency for advisors'],
  service: ['Alex says the link in Priya’s email won’t open', 'Maya says the benchmark explanation is still unclear']
};

/* The full registry of 37 specialists. tools = what each may call through the MCP or API gateway. */
const AGENTS = {
  'sales.lead': { name: 'Lead Me', team: 'sales', does: 'Prioritizes advisors and opportunities using model signals', tools: ['models.sales_alpha', 'models.territory_trends', 'crm.get_opportunities'] },
  'sales.schedule': { name: 'Schedule Me', team: 'sales', does: 'Finds meeting times for advisors or colleagues and places calendar holds', tools: ['calendar.find_times', 'calendar.create_event', 'crm.get_contact'] },
  'sales.prep': { name: 'Prep Me', team: 'sales', does: 'Builds meeting briefs and agendas from what is known about the advisor', tools: ['crm.get_call_notes', 'crm.get_opportunities', 'crm.get_contact', 'crm.get_plan'] },
  'sales.engage': { name: 'Engage Me', team: 'sales', does: 'Captures what advisors say in meetings and answers live questions', tools: ['crm.get_call_notes', 'crm.log_activity'] },

function toolDefs(task, onCall) {
