<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Harness · Connected Client Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>:root{
  --bg:#f5f6f8;--panel:#fff;--sunk:#f8fafc;--ink:#0f172a;--ink2:#334155;--ink3:#64748b;--mut:#94a3b8;--line:#e2e8f0;--line2:#eef2f6;
  --pri:#2f5bea;--pri2:#1e40af;--pri-bg:#eef2ff;--ok:#047857;--ok-bg:#ecfdf5;--ok-ln:#a7f3d0;--warn:#b45309;--warn-bg:#fffbeb;--warn-ln:#fde68a;--bad:#b91c1c;--bad-bg:#fef2f2;
  --r:10px;--r2:14px;--sh1:0 1px 2px rgba(15,23,42,.05);--sh2:0 1px 2px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.06);--sh3:0 12px 32px rgba(15,23,42,.12),0 2px 6px rgba(15,23,42,.06);
  --sans:"Inter",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--serif:"Source Serif 4",Georgia,serif;--mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";letter-spacing:-.005em}
button{font:inherit;color:inherit;cursor:pointer}
code{font:500 11px var(--mono);color:var(--ink3);background:var(--line2);border-radius:4px;padding:1px 5px;white-space:nowrap}
.i{flex:none;display:inline-block;vertical-align:middle}
.app{display:grid;grid-template-rows:56px 1fr auto;height:100vh}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;color:var(--ink2);text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s,transform .1s}
.btn:hover{border-color:#cbd5e1;background:var(--sunk)}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 1px 2px rgba(47,91,234,.3),inset 0 1px 0 rgba(255,255,255,.15)}.btn.primary:hover{background:var(--pri2);border-color:var(--pri2)}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.subtle{background:transparent;border-color:transparent;color:var(--ink3)}.btn.subtle:hover{background:var(--line2);color:var(--ink)}
.btn.block{width:100%}.btn.lg{height:40px;font-size:14px;border-radius:10px}.btn.sm{height:28px;padding:0 10px;font-size:12px}
.link{border:0;background:none;color:var(--ink3);font-size:12px;text-decoration:underline;text-underline-offset:2px;padding:4px 0}
/* avatars */
.ava{--s:36px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-grid;place-items:center;background:linear-gradient(140deg,var(--g1),var(--g2));color:#fff;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.ava b{font-weight:600;font-size:calc(var(--s) * .38);letter-spacing:.02em}
.ava::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid transparent;transition:border-color .2s}
.ava.ready::after{border-color:var(--pri)}.ava.running::after{border-color:var(--pri);border-right-color:transparent;animation:spin 1s linear infinite}.ava.review::after,.ava.signoff::after{border-color:#f59e0b}.ava.approved::after{border-color:#10b981}
/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--line2);color:var(--ink3);border:1px solid transparent}
.badge.ready{background:var(--pri-bg);color:var(--pri)}.badge.running{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}.badge.review{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-ln)}.badge.signoff{background:#fff7ed;color:#c2410c;border-color:#fed7aa}.badge.approved{background:var(--ok-bg);color:var(--ok)}.badge.failed{background:var(--bad-bg);color:var(--bad)}.badge.blocked{background:var(--line2);color:var(--ink3)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:600;background:var(--pri-bg);color:var(--pri);text-transform:capitalize}
.tag.rule{background:var(--line2);color:var(--ink3)}.tag.ai{background:#f5f3ff;color:#6d28d9}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;background:var(--line2);color:var(--ink2);margin:0 4px 4px 0}.chip.strong{background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap}
.muted{color:var(--ink3)}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:spin .8s linear infinite;flex:none;opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
/* top bar */
.top{display:flex;align-items:center;gap:20px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo{width:24px;height:24px;border-radius:7px;background:conic-gradient(from 210deg,#2f5bea,#10b981,#f59e0b,#7c3aed,#2f5bea);box-shadow:inset 0 0 0 5px #fff,0 0 0 1px var(--line)}
.brand b{font-weight:600;font-size:13.5px}.sep{width:1px;height:16px;background:var(--line)}.prod{color:var(--ink3);font-weight:500}
.cmd{flex:1;max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;height:40px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:0 4px 0 4px;transition:border-color .15s,box-shadow .15s,background .15s}
.cmd:focus-within{background:#fff;border-color:#a5b4fc;box-shadow:0 0 0 4px rgba(47,91,234,.12)}
.cmd input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:14px var(--sans);color:var(--ink);padding:0 4px}
.cmd input::placeholder{color:var(--mut)}
.cmd kbd{font:500 11px var(--sans);color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:#fff}
.asker{position:relative}
.askbtn{display:flex;align-items:center;gap:6px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 8px 0 3px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.askbtn .rot{transform:rotate(90deg);color:var(--mut)}
.menu{position:absolute;top:38px;left:-4px;width:290px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh3);padding:6px;z-index:40;animation:rise .15s ease}
.mh{font-size:11px;font-weight:600;color:var(--mut);padding:6px 8px 4px;text-transform:uppercase;letter-spacing:.06em}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 8px;border-radius:8px;text-align:left}.menu button:hover,.menu button.on{background:var(--sunk)}
.menu button span{flex:1;display:flex;flex-direction:column}.menu small{color:var(--ink3);font-size:11.5px}.menu .i{color:var(--pri)}
.topact{display:flex;align-items:center;gap:4px}
/* stage */
.stage{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:0}
body.benched .stage{grid-template-columns:340px minmax(0,1fr) 540px}
/* orchestrator */
.orch{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px 16px 24px}
.ohead{display:flex;align-items:center;gap:10px;margin-bottom:16px}.ohead b{font-weight:600;font-size:14px;display:block}.ohead small{color:var(--ink3);font-size:12px}
.omark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,#4f74ff,#2f5bea);box-shadow:0 2px 6px rgba(47,91,234,.35)}
.omark.pulse{animation:glow 1.4s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 0 0 6px rgba(47,91,234,.15),0 2px 6px rgba(47,91,234,.35)}}
.intro h2{font:600 20px/1.25 var(--sans);letter-spacing:-.02em;margin:4px 0 6px}.intro p{color:var(--ink3);margin:0 0 14px}
.how{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:6px}
.how li{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink2)}.how span{width:20px;height:20px;border-radius:6px;background:var(--pri-bg);color:var(--pri);font-weight:700;font-size:11px;display:grid;place-items:center}
.sh{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}.sh small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--mut)}
.sugs{display:flex;flex-direction:column;gap:6px}
.sug{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px 9px 12px;font-size:13px;color:var(--ink2);transition:all .15s}
.sug span{flex:1}.sug .i{color:var(--mut);transition:transform .15s,color .15s}.sug:hover{border-color:#c7d2fe;background:#fafbff;color:var(--ink)}.sug:hover .i{color:var(--pri);transform:translateX(2px)}
.callout{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);font-size:12.5px;color:var(--ink2);margin:10px 0}
.callout .i{margin-top:1px;color:var(--ink3)}.callout.warn{background:var(--warn-bg);border-color:var(--warn-ln)}.callout.warn .i{color:var(--warn)}.callout.bad{background:var(--bad-bg);border-color:#fecaca;color:var(--bad)}
.reqq{display:flex;gap:10px;padding:12px;border-radius:12px;background:var(--sunk);border:1px solid var(--line2);margin-bottom:12px}
.reqq small{color:var(--ink3);font-size:11.5px;font-weight:500}.reqq p{margin:1px 0 0;font-size:13.5px;font-weight:500;color:var(--ink)}
.scard{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh1)}
.srow{display:flex;align-items:center;gap:8px}.srow b{font-weight:600;font-size:13.5px;flex:1}
.scard small{color:var(--ink3);font-size:12px}.scard .note{font-size:11.5px;text-align:center}
.scard.think{border-color:#c7d2fe;background:linear-gradient(#fafbff,#fff);color:var(--pri)}.scard.think b{color:var(--ink)}
.shimmer{height:4px;border-radius:99px;background:linear-gradient(90deg,var(--pri-bg) 0%,#a5b4fc 50%,var(--pri-bg) 100%);background-size:200% 100%;animation:shim 1.2s linear infinite}@keyframes shim{to{background-position:-200% 0}}
.scard.ask{border-color:var(--warn-ln);background:var(--warn-bg);color:var(--warn)}.scard.ask b{color:var(--ink)}
.scard.ok{border-color:var(--ok-ln);background:linear-gradient(#f0fdf7,#fff);color:var(--ok)}.scard.ok b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line2);border-radius:8px;overflow:hidden}
.kpis div{background:#fff;padding:7px 8px;display:flex;flex-direction:column}.kpis b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}.kpis small{font-size:11px}
.prog{height:4px;background:var(--line2);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,#4f74ff,#10b981);transition:width .5s ease}
.reason{display:flex;flex-direction:column;gap:6px}.rz{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink2);animation:rise .25s ease}
.tl{position:relative}
.wv{font-size:11px;font-weight:600;color:var(--ink3);margin:10px 0 4px 32px}.wv:first-child{margin-top:0}
.tr{position:relative;display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:9px;padding:7px 8px;transition:background .15s,border-color .15s}
.tr:hover{background:var(--sunk)}.tr.sel{background:var(--pri-bg);border-color:#c7d2fe}
.trb{flex:1;min-width:0;display:flex;flex-direction:column}.trb b{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trb small{color:var(--ink3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr.approved .trb b{color:var(--ink3)}
.node{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px;border:1.5px solid var(--line);background:#fff;color:var(--mut)}
.node.ready{border-color:var(--pri);color:var(--pri)}.node.running{border-color:#93c5fd;color:#1d4ed8}.node.review,.node.signoff{border-color:#f59e0b;color:#b45309;background:var(--warn-bg)}.node.approved{border-color:#10b981;background:#10b981;color:#fff}.node.failed{border-color:var(--bad);color:var(--bad)}
.node.sm{width:16px;height:16px}
.ans{display:flex;flex-direction:column;gap:8px}.an{display:flex;gap:8px;align-items:flex-start;font-size:12.5px}.an .i{color:#10b981;margin-top:2px}.an b{font-weight:600;display:block}.an small{color:var(--ink3)}
.kvs{display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.kvr{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:7px 10px;font-size:12.5px;border-top:1px solid var(--line2)}.kvr:first-child{border-top:0}
.kvr>span:first-child{color:var(--ink3)}.kvr>span:last-child{color:var(--ink);display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.qcard{border:1px solid var(--warn-ln);background:var(--warn-bg);border-radius:12px;padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:6px}.qcard p{margin:0;font-size:12.5px;color:var(--ink2)}
.opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-weight:500;text-align:left}.opt:hover{border-color:#fcd34d}
.opt kbd{font:600 10.5px var(--mono);color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.other{display:flex;gap:6px}.other input{flex:1;height:30px;border:1px solid var(--line);border-radius:8px;padding:0 9px;font:inherit;background:#fff}
/* floor */
.floor{overflow-y:auto;padding:14px 20px 24px}
.fh{position:sticky;top:-14px;z-index:3;display:flex;align-items:center;gap:12px;margin:-14px -20px 14px;padding:12px 20px;background:rgba(245,246,248,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line2)}
.fsub{flex:1;color:var(--ink3);font-size:12.5px}
.seg{display:flex;padding:3px;background:#e9edf3;border-radius:10px}
.seg button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border:0;background:none;border-radius:7px;font-weight:600;font-size:13px;color:var(--ink3)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh1)}.seg button:disabled{opacity:.45;cursor:default}
.dotok{width:7px;height:7px;border-radius:50%;background:#10b981;display:inline-block;margin-left:2px}
.team{margin-bottom:18px}
.team header{display:flex;align-items:center;gap:8px;margin-bottom:8px}.team header i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.team header b{font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}.team header small{font-size:12px;color:var(--c);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pc{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;box-shadow:var(--sh1);transition:box-shadow .2s,border-color .2s,transform .2s,opacity .2s;overflow:hidden}
.pc:hover{box-shadow:var(--sh2);border-color:#cbd5e1}
.pc.idle{background:transparent;box-shadow:none;border-style:dashed;padding:9px 12px;opacity:.75}.pc.idle:hover{opacity:1;background:#fff}
.pc.idle .ava{--s:30px !important;filter:grayscale(.6);opacity:.8}
.pc.sel{border-color:var(--pri);box-shadow:0 0 0 3px rgba(47,91,234,.15),var(--sh2)}
.pc.landed{animation:land .6s ease}@keyframes land{30%{transform:translateY(-3px);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent),var(--sh2)}}
.pct{display:flex;align-items:center;gap:10px}
.pcn{flex:1;min-width:0;display:flex;flex-direction:column}.pcn b{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}.pcn small{color:var(--ink3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcn em{font-style:normal;font-size:10px;font-weight:600;color:var(--pri);background:var(--pri-bg);border-radius:4px;padding:0 5px}
.pcb{display:flex;flex-direction:column;gap:6px}
.pti{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--ink2);font-weight:500;line-height:1.35}.pti code{flex:none}
.pag{display:flex;flex-wrap:wrap;gap:4px}.pag em{display:inline-flex;align-items:center;gap:3px;font:500 10.5px var(--mono);font-style:normal;color:var(--ink3);background:var(--sunk);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}.pag em.more{font-family:var(--sans)}
.pbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent}.pbar i{display:block;height:100%;background:var(--c);transition:width .6s ease}
.pbar.running i{background:linear-gradient(90deg,var(--c),#93c5fd,var(--c));background-size:200% 100%;animation:shim 1s linear infinite}.pbar.approved i{background:#10b981}.pbar.blocked i{background:var(--line)}
/* results */
.results{display:flex;flex-direction:column;gap:14px;max-width:1080px}
.hero{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh2);overflow:hidden}
.hl{padding:20px 22px 16px}.hl .st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink3);background:var(--line2);border-radius:99px;padding:3px 10px}.hl .st.ok{background:var(--ok-bg);color:var(--ok)}
.hl h1{font:600 22px/1.3 var(--sans);letter-spacing:-.02em;margin:10px 0 4px}.hl p{margin:0;color:var(--ink3)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line2)}
.metrics div{padding:12px 22px;display:flex;flex-direction:column;border-left:1px solid var(--line2)}.metrics div:first-child{border-left:0}
.metrics b{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.metrics small{color:var(--ink3);font-size:12px}
.signbox{border:1px solid #fed7aa;background:linear-gradient(#fffaf5,#fff);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.signbox header{display:flex;gap:10px;align-items:flex-start;color:#c2410c}.signbox header b{display:block;color:var(--ink);font-weight:600}.signbox header small{color:var(--ink3)}
.sr{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:8px 10px}.sr>div{flex:1}.sr b{display:block;font-weight:600;font-size:13px}.sr small{color:var(--ink3);font-size:12px}
.sh2{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:6px 0 -4px}
.ots{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ot{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--sh1);text-decoration:none;color:inherit;transition:box-shadow .2s,border-color .2s;animation:rise .35s ease both}
.ot:hover{box-shadow:var(--sh2)}
.oti{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--line2);color:var(--ink2)}
.ot.blue .oti{background:#eff6ff;color:#1d4ed8}.ot.violet .oti{background:#f5f3ff;color:#6d28d9}.ot.green .oti{background:var(--ok-bg);color:var(--ok)}.ot.amber .oti{background:var(--warn-bg);color:var(--warn)}.ot.doc .oti{background:#fff1ee;color:#c2410c}
.otb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.otb small{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.otb b{font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}.otb span{font-size:12.5px;color:var(--ink2)}.otb em{font-style:normal;font-size:12px;color:var(--ink3)}.otb em.w{color:#c2410c;font-weight:600}.otb em.ok{color:var(--ok)}
.otb footer{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--ink3)}.otb footer code{margin-left:auto}

/* ===== orchestration canvas layout ===== */
.app{grid-template-rows:56px 1fr}
.stage,body.benched .stage{grid-template-columns:340px minmax(0,1fr);position:relative}
.bench{position:absolute;top:0;right:0;bottom:0;width:min(540px,100%);z-index:20;box-shadow:-24px 0 48px rgba(15,23,42,.14)}

  background:radial-gradient(circle at 1px 1px,#dfe4ec 1px,transparent 1.2px) 0 0/22px 22px,linear-gradient(180deg,#fbfcfe,#f6f8fb);box-shadow:inset 0 1px 0 #fff,var(--sh1)}

.edges path{fill:none}
.edge{stroke:#d5dbe5;stroke-width:1.5}.edge.on{stroke:#b6c2d4}.edge.live{stroke:#9fb3d9}
.beam{stroke:url(#beam);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:60 340;animation:beam 1.6s linear infinite}
@keyframes beam{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
.drop{stroke:#e2e8f0;stroke-width:1.2;stroke-dasharray:3 5}.drop.live{stroke:#a5b4fc;animation:beam 3s linear infinite}
.trail{stroke:#2f5bea;stroke-width:2;opacity:.35;stroke-linecap:round;transition:opacity .6s}.trail.gone{opacity:0}
.trail.report{stroke:#10b981}.trail.handoff{stroke:#7c3aed}.trail.request,.trail.ack{stroke:#64748b}.trail.signoff{stroke:#f59e0b}.trail.deliver{stroke:#10b981}
.nodes{position:absolute;inset:0;z-index:2}
.nd{position:absolute;transition:left .55s cubic-bezier(.4,0,.2,1),top .55s cubic-bezier(.4,0,.2,1),width .4s,box-shadow .25s,border-color .25s}

.nd.ping{animation:ping .7s ease}@keyframes ping{30%{transform:scale(1.04);box-shadow:0 0 0 6px color-mix(in srgb,var(--c,#2f5bea) 18%,transparent),var(--sh2)}}

.nd.req b,.nd.wb>div>b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd.req span,.nd.wb>div>span{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.nd.req{border-left:3px solid #0f172a}.nd.req.done{border-left-color:#10b981}.nd.req.wait{border-left-color:#f59e0b}
.nd.wb{cursor:pointer;border-left:3px solid var(--c)}.nd.wb:hover{box-shadow:var(--sh3)}

.nd.hub{display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff,#eef2ff);border:1px solid #c7d2fe;box-shadow:0 10px 30px rgba(47,91,234,.18),inset 0 0 0 6px #fff}

.fl2{display:inline-flex;align-items:center;gap:6px;margin-right:6px;color:var(--pri);white-space:nowrap}.fl2 b{font-size:12px;font-weight:600;color:var(--ink)}
.ly2{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:7px;font-size:11.5px;color:var(--ink3);background:#fff;border:1px solid var(--line2);white-space:nowrap;transition:all .25s}
.ly2 i{width:6px;height:6px;border-radius:50%;background:var(--c)}.ly2 b{color:var(--ink);font-weight:600}
.ly2.read{border-color:color-mix(in srgb,var(--c) 45%,#fff);background:color-mix(in srgb,var(--c) 8%,#fff);color:var(--ink)}
.ly2.write{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 15%,transparent)}

.lane{position:absolute;inset:0;z-index:3;pointer-events:none}

/* travelling messages */
.pk{position:absolute;left:0;top:0;z-index:6;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:99px;font:600 10.5px var(--sans);white-space:nowrap;pointer-events:none;
  --c:#2f5bea;background:#fff;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,#fff);box-shadow:0 6px 16px rgba(15,23,42,.14)}

.lc footer{display:flex;justify-content:flex-end;margin-top:-4px}.lc footer .link{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--pri);font-weight:600;padding:0}
/* message feed */
.feed{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;overflow:hidden;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh1)}

/* Parse a catalogue route into stages. Items in one stage run together; stages run in order.
   The last stage is the output. Brackets may contain "+" or "/", so split only outside them. */
function parseRoute(route) {
  const splitTop = (s, sep) => { const out = []; let depth = 0, cur = ''; for (let i = 0; i < s.length; i++) { const c = s[i]; if (c === '[') depth++; if (c === ']') depth--; if (depth === 0 && s.startsWith(sep, i)) { out.push(cur); cur = ''; i += sep.length - 1; continue; } cur += c; } out.push(cur); return out.map(x => x.trim()).filter(Boolean); };
  const stages = splitTop(String(route).replace(/\.\s*$/, ''), '→');
  const output = stages.length > 1 ? stages.pop() : '';
  return { output, stages: stages.map(st => splitTop(st, ' + ').flatMap(item => {
    if (/^\[.*\]$/.test(item)) return [{ kind: 'service', raw: item, keys: serviceKeys(item) }];
    const m = item.match(/^(\w+)\.(.+)$/);
    if (m && SUBAGENTS[m[1]]) return m[2].split('/').map(s => { const r = routeInfo(m[1] + '.' + s.trim()); return r ? Object.assign({ kind: 'agent', grp: item }, r) : { kind: 'check', raw: m[1] + '.' + s.trim() }; });
    return [{ kind: 'check', raw: item }];
  })).flatMap(st => st.length > 1 && st.every(i => i.grp && i.grp === st[0].grp) ? st.map(i => [i]) : [st]) }; /* "Schedule.Compliance/Calendar" alone in a stage runs in order */
}

  else if (/\bbook (a|an|the|time|it|me|us|him|her|them|meeting|call)\b|\b(schedule|invite|move|reschedul\w*|log|update|set up (a )?(call|meeting)|create (a )?task|add (a )?task|fix|resolve)\b|won't open|can't open|not working/.test(t)) { a = 'proposed_change'; why = 'The request asks for a change (a booking, an update, a fix).'; }
  else if (/\b(draft|write|compose|create|campaign|outreach|email|post|letter|report)\b/.test(t)) { a = 'draft_only'; why = 'The request asks for something written; drafts only, nothing sent.'; }
  if (team === 'service' && AUTHORITY[a].n < 2) { a = 'proposed_change'; why = 'Service requests are handled as cases, which may be updated.'; }
  return { authority: a, why };
}

/* ---------- running tickets ---------- */

/* ---------- communication: messages travel along the canvas ---------- */

/* the live dock: what each agent is doing right now, without scrolling */

}
function stepsOf(t) {

    ['Drafting', !!t.result, t.result ? 'written' : ''],

    <div class="psh"><span>${busy ? `${I('sparkles', 12)} ${h(HUB)} is planning the steps` : tasks.length ? `${tasks.length - p.removed.size} steps · ${waves.length} wave${waves.length === 1 ? '' : 's'} · ${new Set(tasks.map(t => roleOfT(t).team)).size} teams` : 'Steps'}</span>${p.removed.size && ready ? `<small>${p.removed.size} removed</small>` : ''}</div>
    <div class="psl">${rows || (busy || p.status === 'idle' ? '<div class="pst sk"><span class="psn"></span><i></i></div><div class="pst sk"><span class="psn"></span><i></i></div><div class="pst sk"><span class="psn"></span><i></i></div>' : '')}${busy && rows ? '<div class="pst sk"><span class="psn"></span><i></i></div>' : ''}</div>
    ${p.hints && p.hints.length && sel !== 'territory' ? `<div class="pin"><small>Evidence Intelligence was told to cover</small>${p.hints.map(x => `<span title="${h(x.why)}" style="--c:${ACT_COL[x.action]}"><i></i>${h(ACT[x.action][1])}</span>`).join('')}</div>` : ''}
    <details class="recd"><summary>${I('send', 12)} Decision brief sent to ${h(HUB)}</summary><p class="brief">${h(p.text)}</p></details>
    ${p.decisions[0] ? `<details class="recd"><summary>${I('shield', 12)} Decision record</summary>${recHTML(X.record(p.decisions[0]))}</details>` : ''}
    <footer class="pfoot">${foot}</footer></div></section>`;
}
document.addEventListener('click', e => {
  const q = s => e.target.closest(s); let x;
  if ((x = q('[data-plrm]'))) { const p = planOf(AX.sel); if (p && p.status === 'ready') { const id = x.dataset.plrm; p.removed.has(id) ? p.removed.delete(id) : p.removed.add(id); paintAll(); } return; }
  if ((x = q('[data-plrun]'))) { const p = planOf(x.dataset.plrun); if (p) runPlan(p); return; }
  if ((x = q('[data-plres]'))) { const p = planOf(x.dataset.plres); if (p && p.run && !AO.active) { UI.run = p.run; ST.view = 'results'; AO.viewing = p; ST.msgs = []; ST.approved = new Set(p.run.tasks.map(t => t.id)); paintAll(); } return; }
});


UI.requester = ME; paintAll();
initAI().then(paintAll);
window.HARNESS = { ask, answer, startTask, approve, runAll, ST, status, AO, play, pause };
})();

</script>
